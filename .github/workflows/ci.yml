# LexaVault CI (task 0042). The single required check is `ci-passed`. See docs/install/ci.md.
name: ci

on:
  push:
    branches: [feature/lexavault-r1b-tenant-identity, main]
  pull_request:
    branches: [feature/lexavault-r1b-tenant-identity, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lvtest
          # A throwaway CI database on the job's own runner; not a secret of any real system.
          POSTGRES_PASSWORD: lvtest-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lvtest -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LEXAVAULT_TEST_PG_URL: jdbc:postgresql://localhost:5432/postgres
      LEXAVAULT_TEST_PG_USER: lvtest
      LEXAVAULT_TEST_PG_PASSWORD: lvtest-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OCR engine for the OCR tests
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Maven settings for GitHub Packages (platform-core)
        env:
          PLATFORM_CORE_READ_TOKEN: ${{ secrets.PLATFORM_CORE_READ_TOKEN }}
        run: |
          if [ -z "$PLATFORM_CORE_READ_TOKEN" ]; then echo "Secret PLATFORM_CORE_READ_TOKEN is not set." >&2; exit 1; fi
          mkdir -p ~/.m2
          # The token stays in the environment; settings.xml only names the variable.
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github-platform-core</id>
                <username>mohankandar</username>
                <password>${env.PLATFORM_CORE_READ_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: mvn -B verify (PostgreSQL tests on)
        working-directory: backend
        env:
          PLATFORM_CORE_READ_TOKEN: ${{ secrets.PLATFORM_CORE_READ_TOKEN }}
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/securedoc-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/securedoc-ui/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Browsers for the mocked browser suites
        run: npx playwright install --with-deps chromium webkit
      # Every test:standalone suite runs without a running app (own Vite server, API and identity provider mocked):
      # auth, vocabulary, ui-framework (typecheck + contract), oidc-signin, tablet (WebKit), a11y.
      # Not here: test:e2e and the export E2E, which need the local stack (backend jar, database, Ollama mock).
      - name: test:standalone
        run: npm run test:standalone

  product-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Product-name guard (independence rule)
        run: bash scripts/ci/check-product-names.sh

  ci-passed:
    if: always()
    needs: [backend, frontend, product-names]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} product-names=${{ needs.product-names.result }}"
          [ "${{ needs.backend.result }}" = success ] && [ "${{ needs.frontend.result }}" = success ] && [ "${{ needs.product-names.result }}" = success ]
