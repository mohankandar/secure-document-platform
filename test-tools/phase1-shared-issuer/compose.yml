# PHASE 1 TEST ENVIRONMENT ONLY - throwaway PostgreSQL and Keycloak for the R1B shared-issuer run.
# Never point this at, or reuse names from, the normal containers
# (securedoc-postgres, sdv-postgres, sdv-vault, lexa-keycloak, lexa-keycloak-db).
#
# Always run through Start-Phase1.ps1 / Remove-Phase1.ps1, which pass:
#   -p lexavault-phase1 --env-file C:\dev\lexavault\phase1-run\secrets\phase1.env
# The env file is generated at start-up and lives outside the repository.
# No password is stored in this file or anywhere in the repository.

name: lexavault-phase1

services:
  postgres:
    image: postgres:16-alpine
    container_name: lexavault-phase1-postgres
    labels:
      lexavault.phase: "1"
    environment:
      POSTGRES_DB: lexavault_phase1
      POSTGRES_USER: phase1
      POSTGRES_PASSWORD: ${PHASE1_DB_PASSWORD:?generated by Start-Phase1.ps1 into C:\dev\lexavault\phase1-run\secrets}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - lexavault-phase1-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase1 -d lexavault_phase1"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: lexavault-phase1-keycloak
    labels:
      lexavault.phase: "1"
    # Dev mode with Keycloak's own built-in dev database (inside the container, no extra DB container).
    # The fixed hostname keeps the token issuer exactly http://localhost:18181/realms/<realm>.
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:18181
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: phase1-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PHASE1_KC_ADMIN_PASSWORD:?generated by Start-Phase1.ps1 into C:\dev\lexavault\phase1-run\secrets}
    ports:
      - "127.0.0.1:18181:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  lexavault-phase1-pgdata:
    name: lexavault-phase1-pgdata
    labels:
      lexavault.phase: "1"

networks:
  default:
    name: lexavault-phase1-net
    labels:
      lexavault.phase: "1"
