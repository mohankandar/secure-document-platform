server:
  port: 8080

spring:
  application:
    name: securedoc-platform
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

securedoc:
  demo:
    tenant-id: "00000000-0000-0000-0000-000000000001"
    actor-id: "00000000-0000-0000-0000-000000000099"
  security:
    # Unit 25: secure default. The explicit local profile overrides this to LOCAL.
    mode: ${SECUREDOC_SECURITY_MODE:OIDC}
    cors:
      allowed-origins: ${SECUREDOC_SECURITY_CORS_ALLOWED_ORIGINS:}
    oidc:
      issuer-uri: ${SECUREDOC_SECURITY_OIDC_ISSUER_URI:}
      audience: ${SECUREDOC_SECURITY_OIDC_AUDIENCE:}
      tenant-claim: ${SECUREDOC_SECURITY_OIDC_TENANT_CLAIM:tenant_id}
      username-claim: ${SECUREDOC_SECURITY_OIDC_USERNAME_CLAIM:preferred_username}
      roles-claim: ${SECUREDOC_SECURITY_OIDC_ROLES_CLAIM:groups}
      role-mappings:
        USER: ${SECUREDOC_SECURITY_ROLE_USER:securedoc-user}
        REVIEWER: ${SECUREDOC_SECURITY_ROLE_REVIEWER:securedoc-reviewer}
        APPROVER: ${SECUREDOC_SECURITY_ROLE_APPROVER:securedoc-approver}
        BUSINESS_ADMIN: ${SECUREDOC_SECURITY_ROLE_BUSINESS_ADMIN:securedoc-business-admin}
        TENANT_IT_ADMIN: ${SECUREDOC_SECURITY_ROLE_TENANT_IT_ADMIN:securedoc-tenant-it-admin}
        PLATFORM_OPERATIONS_ADMIN: ${SECUREDOC_SECURITY_ROLE_PLATFORM_OPERATIONS_ADMIN:securedoc-platform-operations-admin}
        REPORT_VIEWER: ${SECUREDOC_SECURITY_ROLE_REPORT_VIEWER:securedoc-report-viewer}
        ADMIN: ${SECUREDOC_SECURITY_ROLE_ADMIN:}
  ai:
    # AI-first discovery is part of the active V1 pipeline. Use "heuristic" only as an
    # explicit development fallback when no local model is available.
    provider: ${SECUREDOC_AI_PROVIDER:ollama}
    # Generic provider/model settings. Legacy OLLAMA_* env names remain supported as fallback.
    base-url: ${SECUREDOC_AI_BASE_URL:${SECUREDOC_AI_OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${SECUREDOC_AI_MODEL:${SECUREDOC_AI_OLLAMA_MODEL:qwen2.5:7b}}
    api-key: ${SECUREDOC_AI_API_KEY:}
    timeout-seconds: ${SECUREDOC_AI_TIMEOUT_SECONDS:60}
    # Page-level execution is bounded and configurable. Transient failures retry only the
    # affected page; successful pages are not replayed.
    parallelism: ${SECUREDOC_AI_PARALLELISM:2}
    page-max-attempts: ${SECUREDOC_AI_PAGE_MAX_ATTEMPTS:2}
    page-retry-backoff-ms: ${SECUREDOC_AI_PAGE_RETRY_BACKOFF_MS:500}
    # Set true in multi-tenant deployments where each tenant must use an explicitly assigned AI endpoint.
    require-tenant-profile: ${SECUREDOC_AI_REQUIRE_TENANT_PROFILE:false}
    secondary-enabled: ${SECUREDOC_AI_SECONDARY_ENABLED:false}
    secondary-provider: ${SECUREDOC_AI_SECONDARY_PROVIDER:ollama}
    secondary-base-url: ${SECUREDOC_AI_SECONDARY_BASE_URL:http://localhost:11434}
    secondary-model: ${SECUREDOC_AI_SECONDARY_MODEL:}
    secondary-api-key: ${SECUREDOC_AI_SECONDARY_API_KEY:}
    secondary-timeout-seconds: ${SECUREDOC_AI_SECONDARY_TIMEOUT_SECONDS:60}
    # Optional deployment-managed per-tenant profiles keyed by tenant UUID.
    # Profiles select transport/model only; redaction categories remain Business Admin policy.
    tenant-profiles: {}
  ocr:
    # Unit 17 local/on-prem OCR. Digital pages keep native PDF text; sparse/image pages use OCR.
    tesseract:
      executable: ${SECUREDOC_OCR_TESSERACT_EXECUTABLE:tesseract}
      language: ${SECUREDOC_OCR_TESSERACT_LANGUAGE:eng}
      page-segmentation-mode: ${SECUREDOC_OCR_TESSERACT_PSM:3}
      timeout-seconds: ${SECUREDOC_OCR_TESSERACT_TIMEOUT_SECONDS:60}
      render-dpi: ${SECUREDOC_OCR_RENDER_DPI:220}
      min-native-characters: ${SECUREDOC_OCR_MIN_NATIVE_CHARACTERS:32}
      minimum-page-confidence: ${SECUREDOC_OCR_MIN_PAGE_CONFIDENCE:0.55}
      blank-page-dark-pixel-ratio: ${SECUREDOC_OCR_BLANK_DARK_PIXEL_RATIO:0.0015}
  delivery:
    # Unit 22: one active final-delivery provider per deployment. Business Admin owns
    # retention/approval policy; provider connection details remain IT/Platform configuration.
    type: ${SECUREDOC_DELIVERY_TYPE:local}
    local:
      output-path: ${SECUREDOC_DELIVERY_LOCAL_OUTPUT_PATH:./securedoc-output}
    api:
      endpoint: ${SECUREDOC_DELIVERY_API_ENDPOINT:}
      bearer-token: ${SECUREDOC_DELIVERY_API_BEARER_TOKEN:}
      timeout-seconds: ${SECUREDOC_DELIVERY_API_TIMEOUT_SECONDS:60}
      require-authentication: ${SECUREDOC_DELIVERY_API_REQUIRE_AUTHENTICATION:true}
      require-https: ${SECUREDOC_DELIVERY_API_REQUIRE_HTTPS:true}
    s3:
      bucket: ${SECUREDOC_DELIVERY_S3_BUCKET:}
      prefix: ${SECUREDOC_DELIVERY_S3_PREFIX:securedoc-output}
      region: ${SECUREDOC_DELIVERY_S3_REGION:us-east-1}
      endpoint: ${SECUREDOC_DELIVERY_S3_ENDPOINT:}
      path-style-access: ${SECUREDOC_DELIVERY_S3_PATH_STYLE_ACCESS:false}
  lifecycle:
    # Unit 22 in-process V1 retention maintenance. Can be replaced with durable scheduling later.
    purge-scheduler-enabled: ${SECUREDOC_LIFECYCLE_PURGE_SCHEDULER_ENABLED:true}
    purge-interval-ms: ${SECUREDOC_LIFECYCLE_PURGE_INTERVAL_MS:900000}
  resilience:
    # Unit 18: retry only explicitly transient dependency failures. Business/content review is never retried.
    max-attempts: ${SECUREDOC_RETRY_MAX_ATTEMPTS:2}
    initial-backoff-ms: ${SECUREDOC_RETRY_INITIAL_BACKOFF_MS:250}
  platform-admin:
    # Unit 24. Provider credentials remain deployment-managed and are never returned by the admin API.
    watched-folder-scheduling-enabled: ${SECUREDOC_WATCHED_FOLDER_SCHEDULING_ENABLED:false}
    watched-folder-scan-interval-ms: ${SECUREDOC_WATCHED_FOLDER_SCAN_INTERVAL_MS:60000}
    watched-folder-tenant-id: ${SECUREDOC_WATCHED_FOLDER_TENANT_ID:}
    watched-folder-actor-id: ${SECUREDOC_WATCHED_FOLDER_ACTOR_ID:}
    watched-folder-actor-username: ${SECUREDOC_WATCHED_FOLDER_ACTOR_USERNAME:watched-folder-service}
  processing:
    enabled: false
  worker:
    enabled: false
    poll-interval-seconds: 30
    batch-size: 5

logging:
  level:
    com.securedoc.platform: INFO
    org.springframework: WARN
