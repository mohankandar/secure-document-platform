server:
  port: 8080
  # Task 0055: this machine only, unless an installation says which address it serves (behind its own TLS proxy).
  address: ${SECUREDOC_SERVER_ADDRESS:127.0.0.1}
  # Task 0056: as with Spring Boot 3.3; Spring Boot 4 would wait for running requests at a stop.
  shutdown: immediate

spring:
  application:
    name: securedoc-platform
  config:
    # Task 0057: setup's platform-tenant.properties (platform.licensing.tenant-id), beside the app unless named.
    import: "${PLATFORM_TENANT_CONFIG:optional:file:./platform-tenant.properties}"
  # Task 0067: the workers of all stages together stay below these connections (10 are kept for requests). With several
  # servers, the database must allow this many for each.
  datasource:
    hikari:
      maximum-pool-size: ${SECUREDOC_DB_CONNECTIONS:40}
      minimum-idle: 10
  # Task 0056: Spring Boot 4 uses Jackson 3, whose defaults differ. These keep the JSON byte for byte as with Spring Boot 3
  # (property order, dates, enums, unknown and null values, characters outside the basic plane) and its text size limit.
  jackson:
    use-jackson2-defaults: true
    mapper:
      detect-parameter-names: true
    json:
      write:
        combine-unicode-surrogates-in-utf8: false
    factory:
      constraints:
        read:
          max-string-length: 20000000
  jpa:
    open-in-view: false
  # Task 0037: the platform Flyway runs (idn_, lic_) belong to the schema step (com.securedoc.install.SchemaStep),
  # never to startup. Flyway is on the classpath only for that step.
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
      # Task 0063: small parts (a PDF password) stay in memory and are never written to a temporary file.
      file-size-threshold: 4KB

# Task 0056: as with Spring Boot 3, the liveness and readiness addresses exist under Kubernetes only.
management:
  endpoint:
    health:
      # Task 0057: the checks' names, codes and causes are on Support, never on the open health address.
      show-details: never
      probes:
        enabled: false

# Task 0054: the platform's outbound rules, used by the test sign-in on Admin > Sign-in only (it calls the stored login
# system's issuer, nothing else). Internal addresses stay off unless the customer's login system is on an internal address.
# The http login system of a local development start needs nothing here (it is allowed by the development licence alone).
platform:
  # Task 0057: the licence. The product code is fixed; the customer ID (TEN-...) is the one setup wrote into
  # platform-tenant.properties (docs/install/SETUP.md). Without it, or without a valid stored licence, the app does not start.
  licensing:
    product-code: LEXAVAULT
    notifications:
      link: /admin/licensing
  # Task 0057: the dependency checks (docs/install/MONITORING.md). product-code: for the login-system check.
  monitoring:
    product-code: LEXAVAULT
    bundle-properties:
      - securedoc.processing.
      - securedoc.resilience.
      - securedoc.lifecycle.
  # Task 0059: notifications (docs/install/NOTIFICATIONS.md). platform.notifications.mail.* and .teams/.slack are not used:
  # each entity's mail server is set on Admin > Notifications. Approval links are on when
  # platform.notifications.approvals.link-key-secret names the key (env:LEXAVAULT_SECRET_INSTALL_...).
  outbound:
    installation: ${PLATFORM_OUTBOUND_INSTALLATION:ON_PREMISES}
    allow-internal-addresses: ${PLATFORM_OUTBOUND_ALLOW_INTERNAL_ADDRESSES:false}

securedoc:
  # Task 0111: a case that still has no documents this many days after it was opened is closed as expired (cancelled,
  # off the dashboard, kept in Reports). Checked every hour.
  cases:
    empty-case-expiry-days: ${SECUREDOC_EMPTY_CASE_EXPIRY_DAYS:7}
  intake:
    space:
      # Task 0067: the safety stop. Below stop-below-percent free on a document storage disk, or of database-size-gb, intake
      # answers busy (LV-INT-027, Retry-After) until everything is above resume-above-percent. PostgreSQL does not tell its
      # free disk: set database-size-gb to the size the database may have (0: not checked).
      stop-below-percent: ${SECUREDOC_INTAKE_SPACE_STOP_BELOW_PERCENT:10}
      resume-above-percent: ${SECUREDOC_INTAKE_SPACE_RESUME_ABOVE_PERCENT:15}
      retry-after-seconds: ${SECUREDOC_INTAKE_SPACE_RETRY_AFTER_SECONDS:300}
      database-size-gb: ${SECUREDOC_INTAKE_SPACE_DATABASE_SIZE_GB:0}
    pacing:
      # From this many waiting jobs the watched folder and polling check half as often and take half as much; from twice as
      # many a quarter, from four times as many an eighth.
      long-queue: ${SECUREDOC_INTAKE_PACING_LONG_QUEUE:200}
  logging:
    environment: ${SECUREDOC_ENVIRONMENT:production}
    node-id: ${SECUREDOC_NODE_ID:unknown}
  demo:
    tenant-id: "30216241-b724-5a3a-aef3-3034fd546d17"
    actor-id: "00000000-0000-0000-0000-000000000099"
  security:
    # Unit 25: secure default. The explicit local profile overrides this to LOCAL.
    mode: ${SECUREDOC_SECURITY_MODE:OIDC}
    cors:
      allowed-origins: ${SECUREDOC_SECURITY_CORS_ALLOWED_ORIGINS:}
    oidc:
      issuer-uri: ${SECUREDOC_SECURITY_OIDC_ISSUER_URI:}
      audience: ${SECUREDOC_SECURITY_OIDC_AUDIENCE:}
      provider-id: ${SECUREDOC_SECURITY_OIDC_PROVIDER_ID:customer-oidc}
      username-claim: ${SECUREDOC_SECURITY_OIDC_USERNAME_CLAIM:preferred_username}
      email-claim: ${SECUREDOC_SECURITY_OIDC_EMAIL_CLAIM:email}
      display-name-claim: ${SECUREDOC_SECURITY_OIDC_DISPLAY_NAME_CLAIM:name}
      # The claim that carries a person's groups. Which group gives which role in which entity is in platform-identity's
      # grants, loaded by setup (task 0058: the configured role mapping is gone).
      roles-claim: ${SECUREDOC_SECURITY_OIDC_ROLES_CLAIM:groups}
      # Task 0054 (SEC-7): the claims only a person's token carries; a token with one of them is refused on the machine
      # paths (push and scanner intake). Empty keeps platform-identity's list. Name your own when your login system puts
      # one of those into its machine tokens.
      machine-user-claims: ${SECUREDOC_SECURITY_OIDC_MACHINE_USER_CLAIMS:}
  # Task 0057: which of LexaVault's own checks refuse a start while down (and make the app not ready).
  monitoring:
    storage-required: ${SECUREDOC_MONITORING_STORAGE_REQUIRED:true}
    model-server-required: ${SECUREDOC_MONITORING_MODEL_SERVER_REQUIRED:false}
  ai:
    # AI-first discovery is part of the active V1 pipeline. Use "heuristic" only as an
    # explicit development fallback when no local model is available.
    provider: ${SECUREDOC_AI_PROVIDER:ollama}
    # Generic provider/model settings. Legacy OLLAMA_* env names remain supported as fallback.
    base-url: ${SECUREDOC_AI_BASE_URL:${SECUREDOC_AI_OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${SECUREDOC_AI_MODEL:${SECUREDOC_AI_OLLAMA_MODEL:qwen2.5:7b}}
    api-key: ${SECUREDOC_AI_API_KEY:}
    timeout-seconds: ${SECUREDOC_AI_TIMEOUT_SECONDS:60}
    # Task 0064: the vision model that reads routed pages. Local Ollama only: a server outside this machine or its
    # private network is never asked. Pinned by digest: the server's model must have exactly this digest, or it is not
    # used (LV-AI-008) and the pages go to a person. A change of model means the model, its digest and a new benchmark.
    vision:
      base-url: ${SECUREDOC_AI_VISION_BASE_URL:${SECUREDOC_AI_BASE_URL:${SECUREDOC_AI_OLLAMA_BASE_URL:http://localhost:11434}}}
      model: ${SECUREDOC_AI_VISION_MODEL:qwen3-vl:8b-instruct}
      model-digest: ${SECUREDOC_AI_VISION_MODEL_DIGEST:70e58e37beb15464e19aa903dedb2cba828b89c0fb186f75ff2738c7347b96eb}
      timeout-seconds: ${SECUREDOC_AI_VISION_TIMEOUT_SECONDS:180}
    # Page-level execution is bounded and configurable. Transient failures retry only the
    # affected page; successful pages are not replayed.
    parallelism: ${SECUREDOC_AI_PARALLELISM:2}
    # Task 0049: IT's own maximum of requests at once per AI server, with pipeline-mode staged (1 to 64; empty: none). The
    # start scripts give Ollama the same number (OLLAMA_NUM_PARALLEL). Task 0067: below it the number is learned: one more
    # at a time while requests wait, one less when the server refuses or only queues; tried again after recheck-ms.
    requests-at-once: ${SECUREDOC_AI_REQUESTS_AT_ONCE:}
    learn:
      up-every-ms: ${SECUREDOC_AI_LEARN_UP_EVERY_MS:120000}
      recheck-ms: ${SECUREDOC_AI_LEARN_RECHECK_MS:3600000}
    page-max-attempts: ${SECUREDOC_AI_PAGE_MAX_ATTEMPTS:2}
    page-retry-backoff-ms: ${SECUREDOC_AI_PAGE_RETRY_BACKOFF_MS:500}
    # Requirement 5 Ollama inference tuning. These are deployment/profile settings; tenant profiles
    # may override them when a tenant uses an explicitly assigned Ollama profile.
    ollama-keep-alive: ${SECUREDOC_AI_OLLAMA_KEEP_ALIVE:5m}
    ollama-structured-output: ${SECUREDOC_AI_OLLAMA_STRUCTURED_OUTPUT:true}
    ollama-thinking-enabled: ${SECUREDOC_AI_OLLAMA_THINKING_ENABLED:false}
    # 0 keeps the model/provider default outside explicitly tuned profiles.
    ollama-context-window-tokens: ${SECUREDOC_AI_OLLAMA_CONTEXT_WINDOW_TOKENS:0}
    ollama-max-output-tokens: ${SECUREDOC_AI_OLLAMA_MAX_OUTPUT_TOKENS:0}
    ollama-page-batch-size: ${SECUREDOC_AI_OLLAMA_PAGE_BATCH_SIZE:1}
    ollama-page-batch-max-characters: ${SECUREDOC_AI_OLLAMA_PAGE_BATCH_MAX_CHARACTERS:14000}
    # Production inference pool. Disabled preserves the single-endpoint behavior.
    # Entries may be comma-separated URLs or stableId=URL (for example ai-1=http://ai01:11434).
    pool-enabled: ${SECUREDOC_AI_POOL_ENABLED:false}
    pool-node-urls: ${SECUREDOC_AI_POOL_NODE_URLS:}
    pool-max-concurrent-per-node: ${SECUREDOC_AI_POOL_MAX_CONCURRENT_PER_NODE:1}
    pool-max-node-attempts: ${SECUREDOC_AI_POOL_MAX_NODE_ATTEMPTS:2}
    pool-health-probe-timeout-ms: ${SECUREDOC_AI_POOL_HEALTH_PROBE_TIMEOUT_MS:1500}
    pool-health-check-interval-ms: ${SECUREDOC_AI_POOL_HEALTH_CHECK_INTERVAL_MS:5000}
    pool-circuit-open-ms: ${SECUREDOC_AI_POOL_CIRCUIT_OPEN_MS:10000}
    pool-queue-wait-ms: ${SECUREDOC_AI_POOL_QUEUE_WAIT_MS:5000}
    # Optional startup preload for the default Ollama model. Disabled in secure base config; explicit local/demo profiles enable it.
    ollama-preload-enabled: ${SECUREDOC_AI_OLLAMA_PRELOAD_ENABLED:false}
    ollama-preload-fail-on-error: ${SECUREDOC_AI_OLLAMA_PRELOAD_FAIL_ON_ERROR:false}
    ollama-preload-timeout-seconds: ${SECUREDOC_AI_OLLAMA_PRELOAD_TIMEOUT_SECONDS:300}
    # Set true in multi-tenant deployments where each tenant must use an explicitly assigned AI endpoint.
    require-tenant-profile: ${SECUREDOC_AI_REQUIRE_TENANT_PROFILE:false}
    secondary-enabled: ${SECUREDOC_AI_SECONDARY_ENABLED:false}
    secondary-provider: ${SECUREDOC_AI_SECONDARY_PROVIDER:ollama}
    secondary-base-url: ${SECUREDOC_AI_SECONDARY_BASE_URL:http://localhost:11434}
    secondary-model: ${SECUREDOC_AI_SECONDARY_MODEL:}
    secondary-api-key: ${SECUREDOC_AI_SECONDARY_API_KEY:}
    secondary-timeout-seconds: ${SECUREDOC_AI_SECONDARY_TIMEOUT_SECONDS:60}
    # Optional deployment-managed per-tenant profiles keyed by tenant UUID.
    # Profiles select transport/model only; redaction categories remain Business Admin policy.
    tenant-profiles: {}
  ocr:
    # Unit 17 local/on-prem OCR. Digital pages keep native PDF text; sparse/image pages use OCR.
    tesseract:
      executable: ${SECUREDOC_OCR_TESSERACT_EXECUTABLE:tesseract}
      language: ${SECUREDOC_OCR_TESSERACT_LANGUAGE:eng}
      page-segmentation-mode: ${SECUREDOC_OCR_TESSERACT_PSM:3}
      timeout-seconds: ${SECUREDOC_OCR_TESSERACT_TIMEOUT_SECONDS:60}
      render-dpi: ${SECUREDOC_OCR_RENDER_DPI:220}
      min-native-characters: ${SECUREDOC_OCR_MIN_NATIVE_CHARACTERS:32}
      # Some mixed PDFs contain only a native title/footer around a large scanned image. Inspect
      # sparse native pages at low DPI and OCR them when the raster content is materially denser
      # than the embedded text, so image-only identity appendices are not skipped.
      sparse-native-image-check-max-characters: ${SECUREDOC_OCR_SPARSE_IMAGE_CHECK_MAX_CHARACTERS:400}
      sparse-native-image-check-dpi: ${SECUREDOC_OCR_SPARSE_IMAGE_CHECK_DPI:72}
      sparse-native-image-dark-pixel-ratio: ${SECUREDOC_OCR_SPARSE_IMAGE_DARK_PIXEL_RATIO:0.006}
      minimum-page-confidence: ${SECUREDOC_OCR_MIN_PAGE_CONFIDENCE:0.55}
      blank-page-dark-pixel-ratio: ${SECUREDOC_OCR_BLANK_DARK_PIXEL_RATIO:0.0015}
  delivery:
    # Unit 22: one active final-delivery provider per deployment. Business Admin owns
    # retention/approval policy; provider connection details remain IT/Platform configuration.
    type: ${SECUREDOC_DELIVERY_TYPE:document-store}
    # Task 0087: the folder with the destinations' published profiles (docs/install/DESTINATIONS.md). Blank: none.
    profile-folder: ${SECUREDOC_DELIVERY_PROFILE_FOLDER:}
    local:
      output-path: ${SECUREDOC_DELIVERY_LOCAL_OUTPUT_PATH:./securedoc-output}
  product-telemetry:
    # Privacy-safe product telemetry is opt-in for on-prem deployments. BASIC/ENHANCED emit only
    # an explicit allow-list to the dedicated PRODUCT_TELEMETRY logger/file; customer content is forbidden.
    mode: ${SECUREDOC_PRODUCT_TELEMETRY_MODE:OFF}
    installation-id: ${SECUREDOC_PRODUCT_TELEMETRY_INSTALLATION_ID:}
    application-version: ${SECUREDOC_APP_VERSION:unknown}
    output-path: ${SECUREDOC_PRODUCT_TELEMETRY_OUTPUT_PATH:./logs/product-telemetry.jsonl}
  lifecycle:
    # Unit 22 in-process V1 retention maintenance. Can be replaced with durable scheduling later.
    purge-scheduler-enabled: ${SECUREDOC_LIFECYCLE_PURGE_SCHEDULER_ENABLED:true}
    purge-interval-ms: ${SECUREDOC_LIFECYCLE_PURGE_INTERVAL_MS:900000}
    # Task 0049: stored text and redacted files that no record points to are removed after this many hours (1 to 8760).
    unrecorded-files-keep-hours: ${SECUREDOC_LIFECYCLE_UNRECORDED_FILES_KEEP_HOURS:24}
  resilience:
    # Unit 18: retry only explicitly transient dependency failures. Business/content review is never retried.
    max-attempts: ${SECUREDOC_RETRY_MAX_ATTEMPTS:2}
    initial-backoff-ms: ${SECUREDOC_RETRY_INITIAL_BACKOFF_MS:250}
  processing:
    # Existing processing-worker flag remains separate from the R3 HA coordination controls.
    enabled: false
    # R3 FIX4: durable ownership + crash recovery for asynchronous package processing.
    coordination:
      enabled: ${SECUREDOC_PROCESSING_COORDINATION_ENABLED:true}
      lease-duration-ms: ${SECUREDOC_PROCESSING_LEASE_DURATION_MS:30000}
      heartbeat-interval-ms: ${SECUREDOC_PROCESSING_HEARTBEAT_INTERVAL_MS:10000}
      recovery-scan-interval-ms: ${SECUREDOC_PROCESSING_RECOVERY_SCAN_INTERVAL_MS:5000}
      recovery-batch-size: ${SECUREDOC_PROCESSING_RECOVERY_BATCH_SIZE:100}
      # One acquired lease generation is one package-processing attempt. Scan cycles are not attempts.
      max-processing-attempts: ${SECUREDOC_PROCESSING_MAX_ATTEMPTS:3}
      # Legacy/pre-HA PROCESSING rows without any lease are eligible for safe recovery after this grace.
      orphan-without-lease-grace-ms: ${SECUREDOC_PROCESSING_ORPHAN_WITHOUT_LEASE_GRACE_MS:60000}
    # Task 0027 (staged pipeline P1): inline = today's behaviour (default); job = the case is exported by an
    # export job with retries by code. Rollout stays inline until P2 is proven. Back to inline: export jobs already
    # queued are finished by the export workers (task 0052); only new cases export inline.
    export-mode: ${SECUREDOC_PROCESSING_EXPORT_MODE:inline}
    # Task 0048 (staged pipeline P2 part 1): inline = today's flow (default); staged = Text, Find and Redact run as
    # per-document jobs with a gate per case. Staged needs export-mode job. Rollout stays inline until P2 is proven.
    pipeline-mode: ${SECUREDOC_PROCESSING_PIPELINE_MODE:inline}
    stage-jobs:
      # A claim lasts this long without renewal (renewed every third of it); then the job goes back to the queue.
      claim-lease-ms: ${SECUREDOC_STAGE_JOBS_CLAIM_LEASE_MS:120000}
      # Claims that may run out (a server stopping mid-job) before the case stops with LV-PRC-008.
      max-attempts: ${SECUREDOC_STAGE_JOBS_MAX_ATTEMPTS:3}
      # Task 0067: the most workers per stage on this server (1 to 64). Empty: measured when the app starts.
      text-workers: ${SECUREDOC_STAGE_JOBS_TEXT_WORKERS:}
      find-workers: ${SECUREDOC_STAGE_JOBS_FIND_WORKERS:}
      redact-workers: ${SECUREDOC_STAGE_JOBS_REDACT_WORKERS:}
      # Task 0064: pages read by the vision model at once.
      vision-workers: ${SECUREDOC_STAGE_JOBS_VISION_WORKERS:}
      poll-interval-ms: ${SECUREDOC_STAGE_JOBS_POLL_INTERVAL_MS:1000}
    capacity:
      # Task 0067: how often the number of workers is set from the queue, and the memory counted per Text or Redact worker.
      scale-every-ms: ${SECUREDOC_CAPACITY_SCALE_EVERY_MS:5000}
      memory-per-worker-mb: ${SECUREDOC_CAPACITY_MEMORY_PER_WORKER_MB:512}
    export-jobs:
      # Task 0028: retry-delay-ms and pause-after-failures are still read but no longer used (destinations are
      # paused by their own check; a single failing case follows retry-schedule).
      retry-delay-ms: ${SECUREDOC_EXPORT_JOBS_RETRY_DELAY_MS:300000}
      # Claims that may run out (a server stopping mid-job) before LV-PRC-008.
      max-attempts: ${SECUREDOC_EXPORT_JOBS_MAX_ATTEMPTS:3}
      pause-after-failures: ${SECUREDOC_EXPORT_JOBS_PAUSE_AFTER_FAILURES:3}
      # A single failing case: the delays between tries (s, m, h), then IT. Rebuilt once before this retry.
      retry-schedule: ${SECUREDOC_EXPORT_JOBS_RETRY_SCHEDULE:5m,15m,1h,4h,12h}
      rebuild-before-retry: ${SECUREDOC_EXPORT_JOBS_REBUILD_BEFORE_RETRY:3}
      # "Answering but failing": failures from this many different cases within the window pause the destination.
      failing-cases-to-pause: ${SECUREDOC_EXPORT_JOBS_FAILING_CASES_TO_PAUSE:3}
      failing-cases-window-ms: ${SECUREDOC_EXPORT_JOBS_FAILING_CASES_WINDOW_MS:600000}
      # 429: the wait without Retry-After, and the quiet time before a destination gets a worker back.
      rate-limit-default-wait-ms: ${SECUREDOC_EXPORT_JOBS_RATE_LIMIT_DEFAULT_WAIT_MS:60000}
      rate-limit-recovery-ms: ${SECUREDOC_EXPORT_JOBS_RATE_LIMIT_RECOVERY_MS:600000}
      # Every destination failing its check within this window: one "can't reach its destinations" alert.
      all-unreachable-window-ms: ${SECUREDOC_EXPORT_JOBS_ALL_UNREACHABLE_WINDOW_MS:120000}
      probe-interval-ms: ${SECUREDOC_EXPORT_JOBS_PROBE_INTERVAL_MS:300000}
      claim-lease-ms: ${SECUREDOC_EXPORT_JOBS_CLAIM_LEASE_MS:120000}
      workers-per-destination: ${SECUREDOC_EXPORT_JOBS_WORKERS_PER_DESTINATION:4}
      # Task 0067: the most export workers on this server. Empty: measured when the app starts.
      workers-total: ${SECUREDOC_EXPORT_JOBS_WORKERS_TOTAL:}
      poll-interval-ms: ${SECUREDOC_EXPORT_JOBS_POLL_INTERVAL_MS:2000}
      # Task 0034: DONE and STOPPED jobs (and cleared reachability alerts) are removed by the retention purge after
      # this many days (7 to 3650; outside that LexaVault stops at start with LV-SYS-005). Rows per delete batch.
      keep-finished-days: ${SECUREDOC_EXPORT_JOBS_KEEP_FINISHED_DAYS:90}
      cleanup-batch-size: ${SECUREDOC_EXPORT_JOBS_CLEANUP_BATCH_SIZE:1000}
  notifications:
    # Task 0059: where people reach the app (https://...). Links in messages start with it; without it nothing is sent.
    app-base-url: ${SECUREDOC_NOTIFICATIONS_APP_BASE_URL:}
    # Messages go to people who signed in within this time, with the roles that sign-in gave.
    people-seen-within: ${SECUREDOC_NOTIFICATIONS_PEOPLE_SEEN_WITHIN:14d}
    mail-ports: ${SECUREDOC_NOTIFICATIONS_MAIL_PORTS:25,465,587,2525}
    check-interval-ms: ${SECUREDOC_NOTIFICATIONS_CHECK_INTERVAL_MS:60000}
  secrets:
    # Task 0059: the folder of secrets named file:LEXAVAULT_SECRET_... (empty: only env: secrets).
    directory: ${SECUREDOC_SECRETS_DIRECTORY:}
  platform-admin:
    # Unit 24. Provider credentials remain deployment-managed and are never returned by the admin API.
    watched-folder-scheduling-enabled: ${SECUREDOC_WATCHED_FOLDER_SCHEDULING_ENABLED:false}
    watched-folder-scan-interval-ms: ${SECUREDOC_WATCHED_FOLDER_SCAN_INTERVAL_MS:60000}
    watched-folder-tenant-id: ${SECUREDOC_WATCHED_FOLDER_TENANT_ID:}
    watched-folder-actor-id: ${SECUREDOC_WATCHED_FOLDER_ACTOR_ID:}
    watched-folder-actor-username: ${SECUREDOC_WATCHED_FOLDER_ACTOR_USERNAME:watched-folder-service}
  worker:
    enabled: false
    poll-interval-seconds: 30
    batch-size: 5

logging:
  config: ${SECUREDOC_LOGGING_CONFIG:classpath:logback-json.xml}
  level:
    root: ${SECUREDOC_LOG_LEVEL_ROOT:INFO}
    com.securedoc.platform: ${SECUREDOC_LOG_LEVEL_APP:INFO}
    org.springframework: ${SECUREDOC_LOG_LEVEL_SPRING:WARN}
    # Task 0056: Hibernate 7 logs the database address at each start; LexaVault did not log it before.
    org.hibernate.orm.connections.pooling: WARN
---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
management:
  endpoint:
    health:
      probes:
        enabled: true
