# Local/Demo configuration — do not use in production
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/securedoc
    username: securedoc
    password: securedoc_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

securedoc:
  logging:
    environment: local
  storage:
    local:
      root-path: ./securedoc-storage
  security:
    mode: LOCAL
    cors:
      allowed-origins: http://localhost:5173
  demo:
    tenant-id: "00000000-0000-0000-0000-000000000001"
    tenant-name: "Local Demo Tenant"
    tenant-slug: "local-demo"
    actor-id: "00000000-0000-0000-0000-000000000099"

  ai:
    # Requirement 5 accepted LOCAL/demo reference model. Gemma3:12b remains explicitly selectable
    # through SECUREDOC_AI_MODEL on larger hardware; there is no silent fallback.
    model: ${SECUREDOC_AI_MODEL:${SECUREDOC_AI_OLLAMA_MODEL:qwen3.5:4b}}
    timeout-seconds: ${SECUREDOC_AI_TIMEOUT_SECONDS:180}
    parallelism: ${SECUREDOC_AI_PARALLELISM:2}
    page-max-attempts: ${SECUREDOC_AI_PAGE_MAX_ATTEMPTS:2}
    page-retry-backoff-ms: ${SECUREDOC_AI_PAGE_RETRY_BACKOFF_MS:500}
    # Keep the model resident, constrain output, disable unnecessary reasoning, and batch two
    # moderate pages per Ollama call. Oversized pages are automatically isolated by max characters.
    ollama-keep-alive: ${SECUREDOC_AI_OLLAMA_KEEP_ALIVE:30m}
    ollama-structured-output: ${SECUREDOC_AI_OLLAMA_STRUCTURED_OUTPUT:true}
    ollama-thinking-enabled: ${SECUREDOC_AI_OLLAMA_THINKING_ENABLED:false}
    ollama-context-window-tokens: ${SECUREDOC_AI_OLLAMA_CONTEXT_WINDOW_TOKENS:8192}
    ollama-max-output-tokens: ${SECUREDOC_AI_OLLAMA_MAX_OUTPUT_TOKENS:2048}
    ollama-page-batch-size: ${SECUREDOC_AI_OLLAMA_PAGE_BATCH_SIZE:2}
    ollama-page-batch-max-characters: ${SECUREDOC_AI_OLLAMA_PAGE_BATCH_MAX_CHARACTERS:14000}
    # Direct Spring startup also preloads the selected local model; fail closed if the configured model cannot be loaded.
    ollama-preload-enabled: ${SECUREDOC_AI_OLLAMA_PRELOAD_ENABLED:true}
    ollama-preload-fail-on-error: ${SECUREDOC_AI_OLLAMA_PRELOAD_FAIL_ON_ERROR:true}
    ollama-preload-timeout-seconds: ${SECUREDOC_AI_OLLAMA_PRELOAD_TIMEOUT_SECONDS:300}

  delivery:
    type: local
  intake:
    watched-folder:
      enabled: false
      root-path: ./watched-intake
      trigger-file-name: manifest.json
      incomplete-visibility-minutes: 15
      accepted-behavior: LEAVE
      rejected-behavior: LEAVE
      archive-directory: _archive
      problem-directory: _problem

  platform-admin:
    # Scheduler stays off by default; enable explicitly for local watched-folder automation.
    watched-folder-scheduling-enabled: false
    watched-folder-scan-interval-ms: 60000
    watched-folder-tenant-id: "00000000-0000-0000-0000-000000000001"
    watched-folder-actor-id: "00000000-0000-0000-0000-000000000099"
    watched-folder-actor-username: watched-folder-service

logging:
  # Keep local/demo close to production observability: JSON is the default.
  # Use SECUREDOC_LOGGING_CONFIG=classpath:logback-local.xml for readable developer output.
  config: ${SECUREDOC_LOGGING_CONFIG:classpath:logback-json.xml}
  level:
    root: ${SECUREDOC_LOG_LEVEL_ROOT:INFO}
    com.securedoc.platform: ${SECUREDOC_LOG_LEVEL_APP:DEBUG}
    org.springframework: ${SECUREDOC_LOG_LEVEL_SPRING:WARN}
