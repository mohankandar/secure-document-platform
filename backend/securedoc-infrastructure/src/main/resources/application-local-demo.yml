# Local/Demo configuration for SecureDoc Infrastructure
# Use with: --spring.profiles.active=local-demo

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/securedoc
    username: securedoc
    password: securedoc_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

securedoc:
  storage:
    local:
      root-path: ./securedoc-storage
