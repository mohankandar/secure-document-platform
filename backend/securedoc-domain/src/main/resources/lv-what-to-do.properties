# GENERATED by LvErrorCodeGuideTest from docs/api/error-codes.md. Do not edit.
LV-INT-001=Check that the request body is valid JSON. Check that each field has the type the API expects (text, number, list or object). Fix the request and send it again. Nothing was taken in.
LV-INT-002=Send the Idempotency-Key and X-Content-SHA256 headers with every document upload. Make sure X-Content-SHA256 is the SHA-256 of the file: 64 hexadecimal characters. Send the PDF in the multipart file part, then send the upload again.
LV-INT-003=Read the message: it names the field. Fill in the field, and keep it within the allowed length (255 characters for ids and names). Make sure the case lists at least one document, then send it again.
LV-INT-004=Check the file's size against the limit for this source. Your IT Admin can see it under Integrations. Make the file smaller, or split it into several documents. If documents of this size are normal for you, ask your IT Admin whether the limit can be raised. Send the file again.
LV-INT-005=Nothing was lost: the case is being processed at Standard. If it needs a higher level, tell the person responsible for the case before it is exported. Change your system to send exactly one of Standard, Confidential or Highly Confidential, spelled and capitalised like that.
LV-INT-006=Check that the file has content before you send it. Create or export the file again from where it came from. Send it again.
LV-INT-007=Save or convert the document as a PDF. If you upload in the browser, choose the PDF file, not another kind of file. If the file already is a PDF, it may be damaged: save it again as a PDF. Send or upload it again.
LV-INT-008=If the PDF has a password, send it through the API with its password, or save a copy without it. If it is damaged, create it again from the original document. Check that it opens in a normal PDF reader, then send it again.
LV-INT-009=Check the page count against the limit for this source. Your IT Admin can see it under Integrations. Split the PDF into smaller documents and list each one in the case. If documents of this size are normal for you, ask your IT Admin whether the limit can be raised, then send again.
LV-INT-010=Check the number of documents against the limit for this source. Your IT Admin can see it under Integrations. Send fewer documents per case, for example by splitting the case into several cases. If cases of this size are normal for you, ask your IT Admin whether the limit can be raised, then send again.
LV-INT-011=Work out the SHA-256 of the exact file you upload. Make sure the same value is in the case's manifest and in the X-Content-SHA256 header. If the file changed after you created the case, send the case again as a new revision.
LV-INT-012=Send the same file again with the same headers. Make sure the checksum is worked out over the exact bytes you send. If it keeps happening, check the network between your system and LexaVault (for example a proxy that changes uploads).
LV-INT-013=Read the message: it names the case field. Send the case again with that field filled in. If you don't know which case fields are required, ask your Business Admin (Case fields).
LV-INT-014=Compare the field's name with the case fields set up for this entity. Source system: if the name is wrong, correct it or stop sending the field. Business Admin: if the field should exist, add it under Case fields. Send the case again.
LV-INT-015=Read the message: it names the field and the rule. Correct the value so it fits the rule. Send or save the case again. If the rule itself is wrong, ask your Business Admin to change it under Case fields.
LV-INT-016=Compare the case fields you sent with the existing case that has the same Primary field. Source system: if your values are wrong, correct them and send again. Business Admin: if the existing case's values are wrong, check them with the team that owns the case.
LV-INT-017=Nothing to do: the content is already in LexaVault. Find the earlier case if you need to follow it. If you meant to send new content, send it as a new revision or a new case.
LV-INT-018=If the content changed, send it again with a new revision number. If you meant to repeat the same request, send exactly the same manifest, fields and sensitivity level as before.
LV-INT-019=Give every different document its own document id. To replace a document that was already received, send the case again as a new revision. To repeat an upload, send exactly the same file as before.
LV-INT-020=Upload only documents that the case's manifest lists. Check that each document id appears only once in the manifest. If the manifest was wrong, send the case again as a new revision with the right list.
LV-INT-021=Use a new, unique Idempotency-Key for each document. Reuse a key only when you repeat the upload of the same document. Send the upload again.
LV-INT-022=Nothing more is needed for this case: it is already being processed. Read the case's status through the API to follow it. If you have new or changed documents, send them as a new revision.
LV-INT-023=Send the case again with the same package id and revision, and with retry switched on. Upload every document before the new deadline. If the content changed, use a new revision instead.
LV-INT-024=Check that the package id and revision are the same as in the earlier attempt. If this is the first time you send the case, send it without retry.
LV-INT-025=Check the case id. Check that you are working in the right entity. If the case should exist, give IT the reference number shown.
LV-INT-026=If the case was already submitted, you don't need to do anything more: open it to follow its progress. If it has no documents, add at least one PDF, then submit. To add documents to a case that was already submitted, create a new case.
LV-INT-027=Wait for the time given in the answer (Retry-After). Send the same request again, with the same Idempotency-Key. Nothing was lost. If it happens often, tell your IT Admin.
LV-INT-028=Split the PDF into files of 500 pages or fewer. Add the parts to the case as separate files. A case can hold up to 50 files. A source system sends the parts as separate documents of the case. The source's own page limit may be lower; your IT Admin can see it under Integrations.
LV-INT-029=Send the case with 50 files or fewer. If more files belong together, split them over several cases. Files already in the case stay as they are; nothing in them was changed.
LV-INT-030=Write the trigger file once all documents of the drop are in place. LexaVault takes the drop in on its next check. If a drop keeps waiting, check that the trigger file was written into the same drop.
LV-INT-031=Check that the trigger file is in the agreed format. Check that it lists only documents inside the same drop. Send the drop again as a new drop. IT Admin: the refused drop was moved aside; check it there if the source can't find the cause.
LV-INT-032=Check that every document the trigger file names is in the drop, with the same name. Write the trigger file last, after all documents are copied. Send the drop again.
LV-INT-033=Copy the PDFs into the drop before you write the trigger file. Send the drop again.
LV-INT-034=Check that the watched folder can be reached from the LexaVault server. Check that LexaVault's account can read, write and move files there, and that there is free space. After the fix, LexaVault picks the drops up again on its next check.
LV-INT-035=Check whether the files in the drop were changed, added or removed after LexaVault started taking it in. Put the complete, unchanged drop in the watched folder again as a new drop, with its trigger file. If it happens again, give IT the reference number from the watched-folder view.
LV-INT-036=Check the password with the person who protected the PDF. Send the same document again with the right password.
LV-INT-037=Send the password in the body part named password, not in the address. Use HTTPS. Behind a proxy, let the proxy say so (X-Forwarded-Proto: https). If the password was in the address, change it: addresses are kept in logs.
LV-INT-040=Check that the source system is running. Check that LexaVault can reach it (network, firewall) and that its address under Integrations is right. Run the connection test. Polling tries again at the next interval.
LV-INT-041=Look at the status in the polling run history. Check your system's own logs for that time. Fix the cause. Polling tries again at the next interval.
LV-INT-042=Check that your list of cases follows the agreed polling format. Check that each document is sent as a PDF. Fix the answer. Polling tries again at the next interval.
LV-INT-043=Nothing was lost: the case was taken in. Check that the source's receipt address is reachable and accepts the confirmation. LexaVault sends the confirmation again on the next run. If the source sends the case again, LexaVault recognises it.
LV-INT-044=Wait for the current run to finish. Look at the run history for its result. Start a new run if you still need one.
LV-SCN-001=Check that the Scan Bridge sends one PDF per case. Check that the Scan Bridge version matches your LexaVault version. If it happens again, give support the reference number.
LV-SCN-002=Ask the operator to scan the document again. If it happens again, check the workstation's disk and its network connection to LexaVault. If it still happens, give support the reference number.
LV-SCN-003=Check the Scan Bridge settings on the workstation: site, scanner and capture mode must be filled in. Restart the Scan Bridge. Ask the operator to scan again.
LV-SCN-004=Check that paper is loaded the right way and that the scanner shows no error. Scan again. If it happens again, tell your IT Admin.
LV-SCN-005=Operator: scan fewer pages at a time, as separate cases. IT Admin: free disk space on the workstation. Scan again.
LV-SCN-006=Finish or cancel the scan that is already waiting. Start the new scan. If the scanner still shows as busy, tell your IT Admin.
LV-SCN-007=Check that the Scan Bridge is switched on. Check its mode: scanner for real scanning, simulator only for testing. Restart the Scan Bridge after changing the setting.
LV-SCN-008=Check that the scanner is connected, switched on and visible to the workstation. Check the scanner setting in the Scan Bridge. Restart the Scan Bridge and try again.
LV-SCN-009=Check the scanner for a paper jam or an error message. For a large stack, scan it in smaller parts. Scan again. If it keeps stopping, tell your IT Admin.
LV-SCN-010=Wait until the scan shows as ready before you send it. If the session ended, reload the page and scan again. If it happens again, tell your IT Admin.
LV-SCN-011=Operator: start the Scan Bridge, or restart the workstation. Reload the page. IT Admin: check that the Scan Bridge is installed and running, and that the browser doesn't block calls to it.
LV-SCN-012=Reload the page. This is often enough after the Scan Bridge was restarted. If it still happens, check that LexaVault's web address is in the Scan Bridge's list of allowed addresses. Restart the Scan Bridge after changing that list.
LV-SCN-013=Check that the Scan Bridge's working location exists, has free space and can be written by the bridge. Restart the Scan Bridge. If it reports damaged state, contact support with the reference number before you delete anything.
LV-SCN-014=Read the Scan Bridge's start-up log: it names the problem. Check that only one Scan Bridge runs on the workstation, that it listens only on the workstation itself, and that LexaVault's address is set. Fix the setting and start the Scan Bridge again.
LV-SCN-015=Check that the workstation can reach LexaVault (network, firewall, proxy). Check LexaVault's address and the bridge's sign-in to LexaVault in the Scan Bridge settings. The scan is kept on the workstation; send it again once LexaVault can be reached.
LV-SCN-016=Open the scan's details: LexaVault's own code is there. Look that code up in this guide and follow its steps. Send the scan again from the Scan Bridge once the cause is fixed.
LV-SCN-017=Check that LexaVault is running and taking in work (run the health checks). Look in Support for the case, in case it arrived after all. If it didn't arrive, send the scan again from the Scan Bridge.
LV-SCN-018=Check the network between the workstation and LexaVault, and that LexaVault is running. Send the scan again from the Scan Bridge. The scan is kept on the workstation. If it fails again, give support the reference number.
LV-SCN-019=Wait for the scan to finish sending; it then shows as sent or as needing attention. If it needs attention, ask your IT Admin to look at it before you scan the case again.
LV-SCN-020=Nothing: the scan is being sent again and LexaVault takes it in only once. If the Scan Bridge restarts often, ask IT to check the workstation.
LV-SCN-021=Wait: the Scan Bridge checks again by itself. If it waits longer than the time limit, it shows LV-SCN-017; then ask your IT Admin.
LV-SCN-022=Cancel this scan in the Scan screen. Start New case again, fill in the case fields and scan the document once more. Nothing was sent.
LV-PRC-001=If the PDF has a password, save a copy without it. If it is damaged, create it again from the original document. Send it again as a new case or a new revision.
LV-PRC-002=Check that the document isn't blank and that its pages show the text clearly. Scan it again at a better quality, or send the original electronic PDF. Send it again.
LV-PRC-003=Scan the page again: higher resolution, straight, clean, good contrast. Send the document again. If good scans keep failing, ask your IT Admin to check the minimum quality setting.
LV-PRC-004=Retry processing from Support. If it happens again, check the server's load and the text reader's time limit. Very large or dense pages may need a longer time limit or more capacity.
LV-PRC-005=Check that the text reader is installed, with its language data, and that LexaVault can run it. Run the health checks. Retry processing from Support.
LV-PRC-006=Retry processing from Support. If it fails again, the PDF may be damaged: ask the source to send it again. If a good PDF keeps failing, give support the reference number.
LV-PRC-007=Check that document storage is available (run the health checks). If storage is fine, the original is gone: ask the source to send the document again. Give support the reference number so they can find out why it was missing.
LV-PRC-008=Open the case's Problem page and look under Technical details for the earlier failure. Fix that cause (look its code up in this guide). Retry processing from Support.
LV-PRC-009=Nothing to do: the document is being processed already. Wait a few minutes and refresh. If the case stays stuck, tell your IT Admin.
LV-PRC-010=Ask the sender for the form printed to an ordinary PDF. Open a new case with that file. If it stops again, give your IT Admin the reference number.
LV-PRC-011=Nothing was delivered: the case stopped before its final check could pass. Retry processing from Support. Give support the reference number: a case should never stop this way.
LV-AI-001=Check that the AI model servers are running and can be reached from LexaVault. Run the health checks. Retry processing from Support once a server is back.
LV-AI-002=Retry processing from Support. If it happens often, check the AI servers' load. Add capacity or raise the AI time limit.
LV-AI-003=Wait a few minutes, then retry processing from Support. If it happens often, add AI capacity or lower how much work LexaVault sends at once.
LV-AI-004=Check that the model named in the AI settings is installed on every AI server. Check the key and the other AI settings. Retry processing from Support.
LV-AI-005=Retry processing from Support. A second answer is often fine. If it happens again, check the model and its output limit in the AI settings. If the case is urgent, a reviewer can continue it by hand.
LV-AI-006=Set up the AI settings for this entity. Ask the IT Admin to retry processing from Support.
LV-AI-007=Check the model name and that the AI servers can be reached. Check that the model is installed on those servers. Start LexaVault again after the fix.
LV-AI-008=Install the approved version of the model on the AI server (its digest is in LexaVault's settings). To change the model, have the new one approved first, then set its name and digest in LexaVault's settings. Pages that needed the model are in Review meanwhile; a person decides them.
LV-RED-001=Open the case's review. For that finding, draw its box on the page, or dismiss it if it is not sensitive. Submit the review again.
LV-RED-002=Nothing unsafe left LexaVault: the copy was not exported. Retry processing from Support. If it fails again, give support the reference number. Don't export the document another way.
LV-RED-003=Retry processing from Support. If it fails again, the PDF may be damaged: ask the source to send it again. If a good PDF keeps failing, give support the reference number.
LV-RED-004=Check that document storage is available and has free space (run the health checks). Retry processing from Support.
LV-RED-005=Nothing about the value is recorded; open the case in Support to see which document stopped. Look at the redacted pages: a box may not fully cover the value, or the value may also be printed elsewhere on an untouched page. Add or enlarge the redaction in review and process again. If the searchable text layer is the cause, turn off "Searchable redacted pages" for the entity (Admin › Policy) and retry: redacted pages are then images only.
LV-REV-001=Refresh the page to see the decision that was made. If you think the decision is wrong, talk to your supervisor.
LV-REV-002=Refresh the page to see where the case is now. You don't need to do anything more on this step.
LV-REV-003=Go through the findings and confirm or dismiss each open one. Make sure every confirmed finding has a box. Continue again.
LV-REV-004=Read the confirmation and tick it. Submit again.
LV-REV-005=Check who the review is assigned to. If you should do it, ask your supervisor to assign it to you.
LV-REV-006=Draw the box again inside the page, with a width and a height. Save again.
LV-REV-007=This case can't be processed again in LexaVault. If it must be processed again, ask the source to send the document as a new case.
LV-REV-008=Check on the Problem page where the case stopped. If it stopped somewhere else, follow the code shown there, or ask your IT Admin to retry processing.
LV-REV-009=Reload the review page; it then shows only the document's own pages. If it happens again, give IT the reference number shown.
LV-REV-010=Check which document the case should hold. Send a new case with the right document.
LV-REV-011=Make a better copy of the document. Send a new case with it.
LV-REV-012=Check with the reviewer's team what should be sent. Send a new case only if it belongs here.
LV-REV-013=Find the other case for the same document. Send nothing more for this one.
LV-REV-014=Read the ticket. Send a new case if the ticket says so.
LV-REV-015=Ask another supervisor to approve this case. Continue with the other cases yourself.
LV-DLV-001=Check that the destination is running and that LexaVault can reach it (network, firewall). Run the connection test under Integrations. Retry the export from Support.
LV-DLV-002=Wait a few minutes, then retry the export from Support. If it keeps failing, contact the destination's team with the time and the reference number.
LV-DLV-003=Look under Technical details for the destination's own code and the level it refused. Ask the destination's team whether it should accept that level, and change its set-up if so. After the fix, choose Retry processing in Support.
LV-DLV-004=Look under Technical details for the destination's own code. Look that code up in the destination's own documentation, or ask its team. Fix the cause, then send the case again from Support.
LV-DLV-005=Check that the credential is stored where the connection's settings say it is. Check with the destination's team that the credential is still valid and has the right access. Run the connection test under Integrations, then retry the export from Support.
LV-DLV-006=Under Integrations, check that this entity has an enabled destination. Check that its profile is chosen and that its address is a valid web address (http or https). The code under Technical details says what is wrong. Switch it on or correct it, then retry the export from Support.
LV-DLV-007=Check that the destination runs a version LexaVault supports. Contact the destination's team with the time and the reference number. Retry the export from Support after the fix.
LV-DLV-008=Check in the destination which documents of the case arrived. Retry the export from Support. If it happens again, contact the destination's team with the reference number.
LV-DLV-009=Nothing to do: the case counts as exported. If you expected a newer version to arrive, check in the destination which version it holds.
LV-DLV-010=Look in the export location for the folder of this case run, left by an earlier attempt. Check whether it is complete, then remove or move it. Send the case again from Support.
LV-DLV-011=Check in the case panel that every document finished processing. If a redacted copy is missing, retry processing from Support. Then retry the export.
LV-DLV-012=Look at the split rules: one page matched more than one of them. Make the rules more specific, so each page matches only one. Ask your IT Admin to retry the export.
LV-DLV-013=Retry from Support. If it fails again, check that document storage is available and that the split rules are complete. If it still fails, give support the reference number.
LV-DLV-014=Look under Technical details for the code of the original failure. Fix that cause (look its code up in this guide). After the fix, choose Retry processing in Support.
LV-DLV-015=Open the case in the IT error queue. Look under Technical details for the code of the failure, and follow its steps in this guide. Send the case again once the cause is fixed.
LV-DLV-016=Look in the destination whether the case is there and complete, by its time and case number. Nothing is sent until this is clear, so it can't arrive twice. If the connection, address or profile was changed, put the earlier one back and send the case again from the IT error queue. Otherwise ask support, with the code and the reference number.
LV-AUT-001=Sign in again. If it keeps asking, close all LexaVault tabs and sign in once more. If it still happens, tell your IT Admin and give the reference number.
LV-AUT-002=Check the person's groups in the login system. Check under Sign-in that one of those groups gives a LexaVault role, and add the person to the right group. Ask the person to sign out and sign in again.
LV-AUT-003=Check that the person's groups give access to this entity. Check that the entity is switched on. Ask the person to sign out and sign in again.
LV-AUT-004=Choose the entity you want to work in from the list. You can switch entity later with the entity switch at the top right.
LV-AUT-005=Check the entity's status. Finish its set-up or switch it on, if it should be in use. Tell its users once it is active.
LV-AUT-006=Check which role the person has and which role the action needs. If the person should be able to do it, give them that role. Ask the person to sign out and sign in again.
LV-AUT-007=Find the reference number in LexaVault's log: it gives the exact reason. Compare the login system's settings with LexaVault's under Sign-in (issuer, audience, groups). Check that LexaVault can reach the login system, then ask the person to sign in again.
LV-AUT-008=Under Integrations, check that the source system's client is linked to an enabled connection for this entity. Check that the source only works on cases its own connection created. Ask the source to send again.
LV-AUT-009=Person: go back to the LexaVault start page and sign in again. If it fails again, close all LexaVault tabs and try once more. IT Admin: if it keeps failing, check LexaVault's settings in the login system and under Sign-in.
LV-AUT-010=Check whether this entity should have the feature. If so, switch it on for the entity. If not, tell the person it isn't available for their entity.
LV-LIC-001=Ask your IT team to store the licence file you received, with the licence command (install guide: Setup). Ask sources to send again any cases that were refused meanwhile.
LV-LIC-002=See the licence's dates under Admin, Licensing. Get a renewed licence from your supplier and ask your IT team to store it with the licence command. No restart is needed. Ask sources to send again any cases that were refused meanwhile. Watched folders and polling go on by themselves.
LV-LIC-003=Ask your IT team to read the licence's own code in Support, Status. Store the original licence file again with the licence command. If the entity isn't in it, ask your supplier for a licence that lists the entity. If it is still refused, get a new licence file from your supplier.
LV-LIC-004=See what the licence covers under Admin, Licensing. Ask your supplier for a licence that covers LexaVault, and ask your IT team to store it with the licence command.
LV-CFG-001=Read the message: it names the field and the allowed range. Correct the value. Save again.
LV-CFG-002=Open Case fields. Make sure at least one case field is active and exactly one is marked Primary. Save, then ask sources to send again any cases that were refused.
LV-CFG-003=Read the message: it says which setting is wrong. Fill in what is missing, use a name and client that no other connection uses, and use an address LexaVault is allowed to call. Save again.
LV-CFG-004=Read the details: they say at which step the test failed. Fix that step (address, sign-in, network, or the other system itself). Run the test again.
LV-CFG-005=Under Integrations, decide which connection is this entity's main export destination. Switch the other one off. Save again.
LV-CFG-006=Fill in every field of the rule, and remove any rule that repeats another. Point the rule to a destination that exists, is switched on and sends out. Save again.
LV-CFG-007=Check which entity the watched folder is set up for. If it should be this entity, set it up for this entity. Otherwise, work with the watched folder from the entity it belongs to.
LV-CFG-008=Under Sign-in, complete the draft login settings. Run the test and fix what it reports (for example the issuer address). Activate the draft once the test passes.
LV-CFG-009=Check the scanner settings in the Scan Bridge (source, resolution, page limit, time limit) against their allowed ranges. Correct the value that is out of range. Restart the Scan Bridge.
LV-CFG-010=Under Integrations, check that the connection is switched on. Check that it is the right kind of connection for this action (for example a polling source). Try again.
LV-CFG-011=Reload the page to see the case's or incident's current state. Holds and restarts are only for cases that stopped and were never exported; a closed incident allows no more actions. If the case needs work again, open it from Support while it still shows a problem.
LV-CFG-012=Save the field without Sensitive, or ask your IT team to set up the key service first (docs/install/KEY_SERVICE.md). Nothing was saved.
LV-CFG-013=Remove the field from the list. Locked items are always removed from documents and never kept beside them. If the field is something else, give it a name that says so.
LV-CFG-014=Decide for this entity: either the item is redacted, or it is kept as a case field. To keep it as a case field, switch the item off under Safe policy first. To redact it, remove the case field first. Save again.
LV-CFG-015=Leave these settings as they were, or add a new field with the new settings and switch the old one off. Existing values stay with the old field.
LV-SYS-001=If you are not IT: try once more, and if it fails again, give IT the reference number and the time. IT Admin: find the reference number in LexaVault's log to see what failed. If the log doesn't explain it, give support the reference number.
LV-SYS-002=Check that the document storage is reachable, has free space and can be written by LexaVault. Run the health checks. Retry the failed work from Support, and ask sources to send again anything that was refused.
LV-SYS-003=Check that the database is running and can be reached from LexaVault. Run the health checks once it is back. Retry the failed work from Support.
LV-SYS-004=Wait a few minutes, then try again. If it happens often, check the server's load and add capacity.
LV-SYS-005=Read LexaVault's start-up log: it names the setting. Correct the setting. Start LexaVault again.
LV-SYS-006=See which part failed its check. Follow the steps for that part: AI model LV-AI-001, text reader LV-PRC-005, database LV-SYS-003, storage LV-SYS-002, destination LV-DLV-001. Run the health checks again.
LV-SYS-007=Find the reference number in LexaVault's log: it gives the temporary file's id. The file is in LexaVault's temporary folder. Delete the file safely. It may hold document content. Check why it couldn't be deleted (access rights, a file still in use).
LV-SYS-008=Reload the page: the item may have been removed by someone else. Check that you are working in the right entity. If the item should be there, give IT the reference number shown.
LV-SYS-009=Check the address and HTTP method against LexaVault's API documentation. Fix the call in the source system and send it again. Nothing was taken in.
LV-SYS-010=Check that the key service is running, unsealed and can be reached from LexaVault. The Support status page names the key service's own code. Nothing is lost: retry the failed work from Support once it is back, and ask sources to send again anything that was refused.
LV-SYS-011=Check LexaVault's login and policy in the key service, and that setup created the customer's keys (docs/install/KEY_SERVICE.md). The Support status page names the key service's own code. After a customer exit this is expected: do not create the keys again. Otherwise retry the failed work from Support.
LV-SYS-012=Don't retry. Find out who or what changed the document storage or its records, for example a partial restore. Restore the file from a backup that belongs to the same database, or ask the source to send the document again.
LV-SYS-013=Check that the erase log location is mounted. Run the erase replay once (docs/install/ERASE_LOG.md), then start LexaVault again.
LV-SYS-014=Check that the erase log location is mounted and can be written by LexaVault. The Support status page names the erase log's own code (docs/install/ERASE_LOG.md). Erasures that were waiting are done by themselves once it is back.
LV-SYS-015=Send less in one request, for example fewer values or a smaller logo. If the request is right, ask IT to raise securedoc.api.max-request-body.
