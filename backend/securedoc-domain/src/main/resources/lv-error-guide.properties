LV-INT-001.support=LexaVault couldn't read the request your system sent. Please have the team that runs that system correct the format and send it again.
LV-INT-001.step.1=Check that the request body is valid JSON.
LV-INT-001.step.2=Check that each field has the type the API expects (text, number, list or object).
LV-INT-001.step.3=Fix the request and send it again. Nothing was taken in.
LV-INT-002.support=The upload came without a header or file part that LexaVault needs. Please have the team that runs the source system add it and send the upload again.
LV-INT-002.step.1=Send the Idempotency-Key and X-Content-SHA256 headers with every document upload.
LV-INT-002.step.2=Make sure X-Content-SHA256 is the SHA-256 of the file: 64 hexadecimal characters.
LV-INT-002.step.3=Send the PDF in the multipart file part, then send the upload again.
LV-INT-003.support=A required field was missing, blank or too long. The message names the field; please have it corrected and the request sent again.
LV-INT-003.step.1=Read the message: it names the field.
LV-INT-003.step.2=Fill in the field, and keep it within the allowed length (255 characters for ids and names).
LV-INT-003.step.3=Make sure the case lists at least one document, then send it again.
LV-INT-004.support=The file is larger than the limit set for this source. Please send a smaller file or split it, or ask your IT Admin about the limit.
LV-INT-004.step.1=Check the file's size against the limit for this source. Your IT Admin can see it under Integrations.
LV-INT-004.step.2=Make the file smaller, or split it into several documents.
LV-INT-004.step.3=If documents of this size are normal for you, ask your IT Admin whether the limit can be raised.
LV-INT-004.step.4=Send the file again.
LV-INT-005.support=The sensitivity level sent wasn't one LexaVault knows, so it was taken in as Standard. If a higher level is needed, please tell the person responsible for the case before it is exported.
LV-INT-005.step.1=Nothing was lost: the case is being processed at Standard.
LV-INT-005.step.2=If it needs a higher level, tell the person responsible for the case before it is exported.
LV-INT-005.step.3=Change your system to send exactly one of Standard, Confidential or Highly Confidential, spelled and capitalised like that.
LV-INT-006.support=The file that arrived has no content. Please create or export it again and send it once more.
LV-INT-006.step.1=Check that the file has content before you send it.
LV-INT-006.step.2=Create or export the file again from where it came from.
LV-INT-006.step.3=Send it again.
LV-INT-007.support=LexaVault takes in PDFs only, and this file isn't one. Please save the document as a PDF and send or upload it again.
LV-INT-007.step.1=Save or convert the document as a PDF.
LV-INT-007.step.2=If you upload in the browser, choose the PDF file, not another kind of file.
LV-INT-007.step.3=If the file already is a PDF, it may be damaged: save it again as a PDF.
LV-INT-007.step.4=Send or upload it again.
LV-INT-008.support=The PDF couldn't be opened because it is damaged or has a password. Please check that it opens in a normal PDF reader; a file with a password has to be sent through the API.
LV-INT-008.step.1=If the PDF has a password, send it through the API with its password, or save a copy without it.
LV-INT-008.step.2=If it is damaged, create it again from the original document.
LV-INT-008.step.3=Check that it opens in a normal PDF reader, then send it again.
LV-INT-009.support=The PDF has more pages than the limit set for this source. Please split it into smaller documents, or ask your IT Admin about the limit.
LV-INT-009.step.1=Check the page count against the limit for this source. Your IT Admin can see it under Integrations.
LV-INT-009.step.2=Split the PDF into smaller documents and list each one in the case.
LV-INT-009.step.3=If documents of this size are normal for you, ask your IT Admin whether the limit can be raised, then send again.
LV-INT-010.support=The case lists more documents than the limit set for this source. Please split it into several cases, or ask your IT Admin about the limit.
LV-INT-010.step.1=Check the number of documents against the limit for this source. Your IT Admin can see it under Integrations.
LV-INT-010.step.2=Send fewer documents per case, for example by splitting the case into several cases.
LV-INT-010.step.3=If cases of this size are normal for you, ask your IT Admin whether the limit can be raised, then send again.
LV-INT-011.support=The checksum sent with the file isn't the one listed for it in the case. Please have the team that runs the source system check it and send the document again.
LV-INT-011.step.1=Work out the SHA-256 of the exact file you upload.
LV-INT-011.step.2=Make sure the same value is in the case's manifest and in the X-Content-SHA256 header.
LV-INT-011.step.3=If the file changed after you created the case, send the case again as a new revision.
LV-INT-012.support=The file received doesn't match its checksum, so it changed on the way. Please send the same file again; if it repeats, ask your IT team to check the network.
LV-INT-012.step.1=Send the same file again with the same headers.
LV-INT-012.step.2=Make sure the checksum is worked out over the exact bytes you send.
LV-INT-012.step.3=If it keeps happening, check the network between your system and LexaVault (for example a proxy that changes uploads).
LV-INT-013.support=A case field that is required is missing. The message names it; please send the case again with that field filled in.
LV-INT-013.step.1=Read the message: it names the case field.
LV-INT-013.step.2=Send the case again with that field filled in.
LV-INT-013.step.3=If you don't know which case fields are required, ask your Business Admin (Case fields).
LV-INT-014.support=A case field was sent that isn't set up for this entity. Either the source system corrects the field, or your Business Admin adds it.
LV-INT-014.step.1=Compare the field's name with the case fields set up for this entity.
LV-INT-014.step.2=Source system: if the name is wrong, correct it or stop sending the field.
LV-INT-014.step.3=Business Admin: if the field should exist, add it under Case fields.
LV-INT-014.step.4=Send the case again.
LV-INT-015.support=The value of a case field breaks the rule set for it. The message names the field and the rule; please correct the value and send or save the case again.
LV-INT-015.step.1=Read the message: it names the field and the rule.
LV-INT-015.step.2=Correct the value so it fits the rule.
LV-INT-015.step.3=Send or save the case again.
LV-INT-015.step.4=If the rule itself is wrong, ask your Business Admin to change it under Case fields.
LV-INT-016.support=The case fields sent match an existing case but don't agree with it. Please compare the two and correct the one that is wrong.
LV-INT-016.step.1=Compare the case fields you sent with the existing case that has the same Primary field.
LV-INT-016.step.2=Source system: if your values are wrong, correct them and send again.
LV-INT-016.step.3=Business Admin: if the existing case's values are wrong, check them with the team that owns the case.
LV-INT-017.support=LexaVault already has this content, so nothing new was created. No action is needed unless you meant to send something new.
LV-INT-017.step.1=Nothing to do: the content is already in LexaVault.
LV-INT-017.step.2=Find the earlier case if you need to follow it.
LV-INT-017.step.3=If you meant to send new content, send it as a new revision or a new case.
LV-INT-018.support=This revision was sent before with different content. Please send the changed content as a new revision.
LV-INT-018.step.1=If the content changed, send it again with a new revision number.
LV-INT-018.step.2=If you meant to repeat the same request, send exactly the same manifest, fields and sensitivity level as before.
LV-INT-019.support=This document id was already used for different content. Please have the source system use its own id for each document, or send the change as a new revision.
LV-INT-019.step.1=Give every different document its own document id.
LV-INT-019.step.2=To replace a document that was already received, send the case again as a new revision.
LV-INT-019.step.3=To repeat an upload, send exactly the same file as before.
LV-INT-020.support=The document isn't in the case's list, or is in it twice. Please have the source system correct the list and send the case as a new revision.
LV-INT-020.step.1=Upload only documents that the case's manifest lists.
LV-INT-020.step.2=Check that each document id appears only once in the manifest.
LV-INT-020.step.3=If the manifest was wrong, send the case again as a new revision with the right list.
LV-INT-021.support=The source system used the same idempotency key for two different documents. Please have it use a new key for each document and send the upload again.
LV-INT-021.step.1=Use a new, unique Idempotency-Key for each document.
LV-INT-021.step.2=Reuse a key only when you repeat the upload of the same document.
LV-INT-021.step.3=Send the upload again.
LV-INT-022.support=All documents of this case were already received, so it can't take more. New or changed documents need a new revision.
LV-INT-022.step.1=Nothing more is needed for this case: it is already being processed.
LV-INT-022.step.2=Read the case's status through the API to follow it.
LV-INT-022.step.3=If you have new or changed documents, send them as a new revision.
LV-INT-023.support=Not all documents of the case arrived before the deadline. Please have the case sent again with retry switched on.
LV-INT-023.step.1=Send the case again with the same package id and revision, and with retry switched on.
LV-INT-023.step.2=Upload every document before the new deadline.
LV-INT-023.step.3=If the content changed, use a new revision instead.
LV-INT-024.support=A retry was asked for, but there is no earlier attempt to retry. Please check the package id and revision, or send the case without retry.
LV-INT-024.step.1=Check that the package id and revision are the same as in the earlier attempt.
LV-INT-024.step.2=If this is the first time you send the case, send it without retry.
LV-INT-025.support=There is no case with this id in the entity you are working in. Please check the id and the entity; if the case should exist, send us the reference number.
LV-INT-025.step.1=Check the case id.
LV-INT-025.step.2=Check that you are working in the right entity.
LV-INT-025.step.3=If the case should exist, give IT the reference number shown.
LV-INT-026.support=The case can't take documents: it was already submitted, or it has none to submit. Please open the case to see which, or start a new case for more documents.
LV-INT-026.step.1=If the case was already submitted, you don't need to do anything more: open it to follow its progress.
LV-INT-026.step.2=If it has no documents, add at least one PDF, then submit.
LV-INT-026.step.3=To add documents to a case that was already submitted, create a new case.
LV-INT-027.support=LexaVault couldn't take this in because it was full at that moment; nothing was lost. The source system can send the same request again after the time given in the answer.
LV-INT-027.step.1=Wait for the time given in the answer (Retry-After).
LV-INT-027.step.2=Send the same request again, with the same Idempotency-Key. Nothing was lost.
LV-INT-027.step.3=If it happens often, tell your IT Admin.
LV-INT-028.support=A PDF can have up to 500 pages, and nothing was taken in from this file. Please split it and send the parts as separate documents.
LV-INT-028.step.1=Split the PDF into files of 500 pages or fewer.
LV-INT-028.step.2=Add the parts to the case as separate files. A case can hold up to 50 files.
LV-INT-028.step.3=A source system sends the parts as separate documents of the case. The source's own page limit may be lower; your IT Admin can see it under Integrations.
LV-INT-029.support=A case can hold up to 50 files, and nothing more was taken in. Please split the files over several cases.
LV-INT-029.step.1=Send the case with 50 files or fewer.
LV-INT-029.step.2=If more files belong together, split them over several cases.
LV-INT-029.step.3=Files already in the case stay as they are; nothing in them was changed.
LV-INT-030.support=The folder drop is waiting for its trigger file, so it hasn't been taken in. Please check that the source system writes the trigger file into the same drop.
LV-INT-030.step.1=Write the trigger file once all documents of the drop are in place.
LV-INT-030.step.2=LexaVault takes the drop in on its next check.
LV-INT-030.step.3=If a drop keeps waiting, check that the trigger file was written into the same drop.
LV-INT-031.support=The trigger file isn't in the expected format or points outside its folder. Please have the source system correct it and send a new drop.
LV-INT-031.step.1=Check that the trigger file is in the agreed format.
LV-INT-031.step.2=Check that it lists only documents inside the same drop.
LV-INT-031.step.3=Send the drop again as a new drop.
LV-INT-031.step.4=IT Admin: the refused drop was moved aside; check it there if the source can't find the cause.
LV-INT-032.support=The trigger file lists a document that isn't in the drop. Please have the source system copy every document first, write the trigger file last, and send the drop again.
LV-INT-032.step.1=Check that every document the trigger file names is in the drop, with the same name.
LV-INT-032.step.2=Write the trigger file last, after all documents are copied.
LV-INT-032.step.3=Send the drop again.
LV-INT-033.support=The folder drop has a trigger file but no PDFs. Please copy the PDFs in before the trigger file and send the drop again.
LV-INT-033.step.1=Copy the PDFs into the drop before you write the trigger file.
LV-INT-033.step.2=Send the drop again.
LV-INT-034.support=LexaVault can't work with files in the watched folder. Please have your IT Admin check that the folder can be reached, its access rights and its free space.
LV-INT-034.step.1=Check that the watched folder can be reached from the LexaVault server.
LV-INT-034.step.2=Check that LexaVault's account can read, write and move files there, and that there is free space.
LV-INT-034.step.3=After the fix, LexaVault picks the drops up again on its next check.
LV-INT-035.support=The files in this drop are no longer the ones LexaVault started with. Please send the complete drop again as a new drop.
LV-INT-035.step.1=Check whether the files in the drop were changed, added or removed after LexaVault started taking it in.
LV-INT-035.step.2=Put the complete, unchanged drop in the watched folder again as a new drop, with its trigger file.
LV-INT-035.step.3=If it happens again, give IT the reference number from the watched-folder view.
LV-INT-036.support=The password sent with the PDF doesn't open it, and nothing was taken in. Please check the password with the person who protected the file and send it again.
LV-INT-036.step.1=Check the password with the person who protected the PDF.
LV-INT-036.step.2=Send the same document again with the right password.
LV-INT-037.support=The password was sent in a way LexaVault doesn't accept, and nothing was taken in. Please have the source system's team correct it; if the password was in the address, it should be changed. Never send us the password.
LV-INT-037.step.1=Send the password in the body part named password, not in the address.
LV-INT-037.step.2=Use HTTPS. Behind a proxy, let the proxy say so (X-Forwarded-Proto: https).
LV-INT-037.step.3=If the password was in the address, change it: addresses are kept in logs.
LV-INT-040.support=LexaVault couldn't reach your source system. Please check that it is running, and have your IT Admin check the network and the connection's address.
LV-INT-040.step.1=Check that the source system is running.
LV-INT-040.step.2=Check that LexaVault can reach it (network, firewall) and that its address under Integrations is right.
LV-INT-040.step.3=Run the connection test. Polling tries again at the next interval.
LV-INT-041.support=Your source system answered LexaVault with an error. Please have the team that runs it check its own logs for that time.
LV-INT-041.step.1=Look at the status in the polling run history.
LV-INT-041.step.2=Check your system's own logs for that time.
LV-INT-041.step.3=Fix the cause. Polling tries again at the next interval.
LV-INT-042.support=LexaVault couldn't understand the answer of your source system. Please have the team that runs it check the agreed polling format.
LV-INT-042.step.1=Check that your list of cases follows the agreed polling format.
LV-INT-042.step.2=Check that each document is sent as a PDF.
LV-INT-042.step.3=Fix the answer. Polling tries again at the next interval.
LV-INT-043.support=The case was taken in, but LexaVault couldn't confirm that to your source system, which may send it again. Please have your IT Admin check the source's receipt address.
LV-INT-043.step.1=Nothing was lost: the case was taken in.
LV-INT-043.step.2=Check that the source's receipt address is reachable and accepts the confirmation.
LV-INT-043.step.3=LexaVault sends the confirmation again on the next run. If the source sends the case again, LexaVault recognises it.
LV-INT-044.support=A collection from this source was already running, so a second one wasn't started. Please look at the run history for its result.
LV-INT-044.step.1=Wait for the current run to finish.
LV-INT-044.step.2=Look at the run history for its result.
LV-INT-044.step.3=Start a new run if you still need one.
LV-INT-045.support=The source system's answer was larger than LexaVault takes, so it was not read and nothing was stored. Please have the source system send smaller answers (fewer cases per answer).
LV-INT-045.step.1=Ask the source system's team to send fewer cases per answer.
LV-INT-045.step.2=If the answers are expected to be this large, have the IT Admin raise the polling answer limit.
LV-INT-045.step.3=Start a new run.
LV-SCN-001.support=A scan has to be sent as exactly one PDF. Please have your IT Admin check the Scan Bridge; if it repeats, send us the reference number.
LV-SCN-001.step.1=Check that the Scan Bridge sends one PDF per case.
LV-SCN-001.step.2=Check that the Scan Bridge version matches your LexaVault version.
LV-SCN-001.step.3=If it happens again, give support the reference number.
LV-SCN-002.support=The scanned file received isn't the size the scanner announced. Please scan again; if it repeats, have your IT Admin check the workstation and its network.
LV-SCN-002.step.1=Ask the operator to scan the document again.
LV-SCN-002.step.2=If it happens again, check the workstation's disk and its network connection to LexaVault.
LV-SCN-002.step.3=If it still happens, give support the reference number.
LV-SCN-003.support=The scan came without the scanner details LexaVault needs. Please have your IT Admin check the Scan Bridge settings on that workstation.
LV-SCN-003.step.1=Check the Scan Bridge settings on the workstation: site, scanner and capture mode must be filled in.
LV-SCN-003.step.2=Restart the Scan Bridge.
LV-SCN-003.step.3=Ask the operator to scan again.
LV-SCN-004.support=The scan had no pages or wasn't a PDF. Please check the paper and the scanner, and scan again.
LV-SCN-004.step.1=Check that paper is loaded the right way and that the scanner shows no error.
LV-SCN-004.step.2=Scan again.
LV-SCN-004.step.3=If it happens again, tell your IT Admin.
LV-SCN-005.support=The scan is over the size limit, or the workstation is low on disk space. Please scan fewer pages at a time and have your IT Admin check the disk.
LV-SCN-005.step.1=Operator: scan fewer pages at a time, as separate cases.
LV-SCN-005.step.2=IT Admin: free disk space on the workstation.
LV-SCN-005.step.3=Scan again.
LV-SCN-006.support=Another scan is still waiting on this workstation. Please finish or cancel it, then scan again.
LV-SCN-006.step.1=Finish or cancel the scan that is already waiting.
LV-SCN-006.step.2=Start the new scan.
LV-SCN-006.step.3=If the scanner still shows as busy, tell your IT Admin.
LV-SCN-007.support=The Scan Bridge on this workstation is switched off or in the wrong mode. Please have your IT Admin check its settings.
LV-SCN-007.step.1=Check that the Scan Bridge is switched on.
LV-SCN-007.step.2=Check its mode: scanner for real scanning, simulator only for testing.
LV-SCN-007.step.3=Restart the Scan Bridge after changing the setting.
LV-SCN-008.support=The Scan Bridge can't find a supported scanner. Please check that it is connected and switched on, and have your IT Admin check the scanner setting.
LV-SCN-008.step.1=Check that the scanner is connected, switched on and visible to the workstation.
LV-SCN-008.step.2=Check the scanner setting in the Scan Bridge.
LV-SCN-008.step.3=Restart the Scan Bridge and try again.
LV-SCN-009.support=The scan stopped before it finished. Please check the scanner for a paper jam or an error, and scan again in smaller parts if the stack is large.
LV-SCN-009.step.1=Check the scanner for a paper jam or an error message.
LV-SCN-009.step.2=For a large stack, scan it in smaller parts.
LV-SCN-009.step.3=Scan again. If it keeps stopping, tell your IT Admin.
LV-SCN-010.support=The scan session ended, or the scan wasn't ready to send. Please wait until it shows as ready, or reload the page and scan again.
LV-SCN-010.step.1=Wait until the scan shows as ready before you send it.
LV-SCN-010.step.2=If the session ended, reload the page and scan again.
LV-SCN-010.step.3=If it happens again, tell your IT Admin.
LV-SCN-011.support=The browser can't reach the Scan Bridge on this workstation. Please start it or restart the workstation; if that doesn't help, ask your IT Admin.
LV-SCN-011.step.1=Operator: start the Scan Bridge, or restart the workstation.
LV-SCN-011.step.2=Reload the page.
LV-SCN-011.step.3=IT Admin: check that the Scan Bridge is installed and running, and that the browser doesn't block calls to it.
LV-SCN-012.support=The Scan Bridge didn't accept a request from this page. Please reload the page; if it repeats, have your IT Admin check the Scan Bridge's allowed addresses.
LV-SCN-012.step.1=Reload the page. This is often enough after the Scan Bridge was restarted.
LV-SCN-012.step.2=If it still happens, check that LexaVault's web address is in the Scan Bridge's list of allowed addresses.
LV-SCN-012.step.3=Restart the Scan Bridge after changing that list.
LV-SCN-013.support=The Scan Bridge can't read or write its working files. Please have your IT Admin check them, and contact us before deleting anything.
LV-SCN-013.step.1=Check that the Scan Bridge's working location exists, has free space and can be written by the bridge.
LV-SCN-013.step.2=Restart the Scan Bridge.
LV-SCN-013.step.3=If it reports damaged state, contact support with the reference number before you delete anything.
LV-SCN-014.support=The Scan Bridge couldn't start. Please have your IT Admin read its start-up log, which names the problem.
LV-SCN-014.step.1=Read the Scan Bridge's start-up log: it names the problem.
LV-SCN-014.step.2=Check that only one Scan Bridge runs on the workstation, that it listens only on the workstation itself, and that LexaVault's address is set.
LV-SCN-014.step.3=Fix the setting and start the Scan Bridge again.
LV-SCN-015.support=The Scan Bridge can't reach LexaVault; the scan is kept on the workstation. Please have your IT Admin check the network and the bridge's settings.
LV-SCN-015.step.1=Check that the workstation can reach LexaVault (network, firewall, proxy).
LV-SCN-015.step.2=Check LexaVault's address and the bridge's sign-in to LexaVault in the Scan Bridge settings.
LV-SCN-015.step.3=The scan is kept on the workstation; send it again once LexaVault can be reached.
LV-SCN-016.support=LexaVault refused the scan and gave its own code for the reason. Please send us that code, or look it up in this guide.
LV-SCN-016.step.1=Open the scan's details: LexaVault's own code is there.
LV-SCN-016.step.2=Look that code up in this guide and follow its steps.
LV-SCN-016.step.3=Send the scan again from the Scan Bridge once the cause is fixed.
LV-SCN-017.support=LexaVault hasn't accepted the scan within the time limit. Please have your IT Admin check that LexaVault is running and whether the case arrived before it is sent again.
LV-SCN-017.step.1=Check that LexaVault is running and taking in work (run the health checks).
LV-SCN-017.step.2=Look in Support for the case, in case it arrived after all.
LV-SCN-017.step.3=If it didn't arrive, send the scan again from the Scan Bridge.
LV-SCN-018.support=The scan couldn't be sent after 3 tries; it is kept on the workstation. Please have your IT Admin check the network and send it again.
LV-SCN-018.step.1=Check the network between the workstation and LexaVault, and that LexaVault is running.
LV-SCN-018.step.2=Send the scan again from the Scan Bridge. The scan is kept on the workstation.
LV-SCN-018.step.3=If it fails again, give support the reference number.
LV-SCN-019.support=The scan can't be cancelled because it is being sent or needs attention first. Please wait, or ask your IT Admin to look at it before scanning the case again.
LV-SCN-019.step.1=Wait for the scan to finish sending; it then shows as sent or as needing attention.
LV-SCN-019.step.2=If it needs attention, ask your IT Admin to look at it before you scan the case again.
LV-SCN-020.support=The Scan Bridge restarted and picked the scan up where it left off. No action is needed; LexaVault takes the scan in only once.
LV-SCN-020.step.1=Nothing: the scan is being sent again and LexaVault takes it in only once.
LV-SCN-020.step.2=If the Scan Bridge restarts often, ask IT to check the workstation.
LV-SCN-021.support=The scan was sent and LexaVault hasn't confirmed it yet. Please wait; the Scan Bridge checks again by itself.
LV-SCN-021.step.1=Wait: the Scan Bridge checks again by itself.
LV-SCN-021.step.2=If it waits longer than the time limit, it shows LV-SCN-017; then ask your IT Admin.
LV-SCN-022.support=After a restart, the Scan Bridge no longer has the sensitive case fields, so this scan can't be sent. Please cancel it, fill in the fields again in a new case and scan once more.
LV-SCN-022.step.1=Cancel this scan in the Scan screen.
LV-SCN-022.step.2=Start New case again, fill in the case fields and scan the document once more. Nothing was sent.
LV-PRC-001.support=The PDF couldn't be opened because it is damaged or has a password. Please make a copy that opens without a password and send it as a new case or revision.
LV-PRC-001.step.1=If the PDF has a password, save a copy without it.
LV-PRC-001.step.2=If it is damaged, create it again from the original document.
LV-PRC-001.step.3=Send it again as a new case or a new revision.
LV-PRC-002.support=No text could be read in the document. Please check that it isn't blank, and send a clearer scan or the original electronic PDF.
LV-PRC-002.step.1=Check that the document isn't blank and that its pages show the text clearly.
LV-PRC-002.step.2=Scan it again at a better quality, or send the original electronic PDF.
LV-PRC-002.step.3=Send it again.
LV-PRC-003.support=A page's scan quality is too low to read reliably. Please scan it again with better quality and send the document again.
LV-PRC-003.step.1=Scan the page again: higher resolution, straight, clean, good contrast.
LV-PRC-003.step.2=Send the document again.
LV-PRC-003.step.3=If good scans keep failing, ask your IT Admin to check the minimum quality setting.
LV-PRC-004.support=Reading the text of a page took too long, so processing stopped. Your IT Admin can retry it from Support.
LV-PRC-004.step.1=Retry processing from Support.
LV-PRC-004.step.2=If it happens again, check the server's load and the text reader's time limit.
LV-PRC-004.step.3=Very large or dense pages may need a longer time limit or more capacity.
LV-PRC-005.support=The text reader isn't available on the LexaVault server. Please have your IT Admin check it, then retry processing.
LV-PRC-005.step.1=Check that the text reader is installed, with its language data, and that LexaVault can run it.
LV-PRC-005.step.2=Run the health checks.
LV-PRC-005.step.3=Retry processing from Support.
LV-PRC-006.support=A page couldn't be prepared for reading. Your IT Admin can retry it; if a good PDF keeps failing, please send us the reference number.
LV-PRC-006.step.1=Retry processing from Support.
LV-PRC-006.step.2=If it fails again, the PDF may be damaged: ask the source to send it again.
LV-PRC-006.step.3=If a good PDF keeps failing, give support the reference number.
LV-PRC-007.support=The original file isn't in storage. Please have your IT Admin check the storage first, and send us the reference number so we can help find out why.
LV-PRC-007.step.1=Check that document storage is available (run the health checks).
LV-PRC-007.step.2=If storage is fine, the original is gone: ask the source to send the document again.
LV-PRC-007.step.3=Give support the reference number so they can find out why it was missing.
LV-PRC-008.support=Processing failed 3 times, so it stopped. Please have your IT Admin look up the earlier failure on the case's Problem page and fix that first.
LV-PRC-008.step.1=Open the case's Problem page and look under Technical details for the earlier failure.
LV-PRC-008.step.2=Fix that cause (look its code up in this guide).
LV-PRC-008.step.3=Retry processing from Support.
LV-PRC-009.support=The document is already being processed. Please wait and refresh; if it stays stuck, tell your IT Admin.
LV-PRC-009.step.1=Nothing to do: the document is being processed already.
LV-PRC-009.step.2=Wait a few minutes and refresh.
LV-PRC-009.step.3=If the case stays stuck, tell your IT Admin.
LV-PRC-010.support=This kind of form can't be read by LexaVault, so it was not processed. Please ask the sender for the form printed to an ordinary PDF.
LV-PRC-010.step.1=Ask the sender for the form printed to an ordinary PDF.
LV-PRC-010.step.2=Open a new case with that file.
LV-PRC-010.step.3=If it stops again, give your IT Admin the reference number.
LV-AI-001.support=LexaVault couldn't reach its AI model on any server. Please have your IT Admin check the AI servers, then retry processing.
LV-AI-001.step.1=Check that the AI model servers are running and can be reached from LexaVault.
LV-AI-001.step.2=Run the health checks.
LV-AI-001.step.3=Retry processing from Support once a server is back.
LV-AI-002.support=The AI model took too long to answer. Your IT Admin can retry processing, and check the AI servers' load if it repeats.
LV-AI-002.step.1=Retry processing from Support.
LV-AI-002.step.2=If it happens often, check the AI servers' load.
LV-AI-002.step.3=Add capacity or raise the AI time limit.
LV-AI-003.support=The AI model was too busy to answer. Please have your IT Admin retry after a few minutes.
LV-AI-003.step.1=Wait a few minutes, then retry processing from Support.
LV-AI-003.step.2=If it happens often, add AI capacity or lower how much work LexaVault sends at once.
LV-AI-004.support=The AI model didn't accept the request: it isn't installed, or its key or settings are wrong. Please have your IT Admin check the AI settings.
LV-AI-004.step.1=Check that the model named in the AI settings is installed on every AI server.
LV-AI-004.step.2=Check the key and the other AI settings.
LV-AI-004.step.3=Retry processing from Support.
LV-AI-005.support=The AI model's answer couldn't be used. Your IT Admin can retry processing, or a reviewer can continue the case by hand.
LV-AI-005.step.1=Retry processing from Support. A second answer is often fine.
LV-AI-005.step.2=If it happens again, check the model and its output limit in the AI settings.
LV-AI-005.step.3=If the case is urgent, a reviewer can continue it by hand.
LV-AI-006.support=No AI settings exist for this entity yet. The platform operations team has to set them up before processing is retried.
LV-AI-006.step.1=Set up the AI settings for this entity.
LV-AI-006.step.2=Ask the IT Admin to retry processing from Support.
LV-AI-007.support=The AI model couldn't be loaded when LexaVault started. Please have your IT Admin check the model's name and the AI servers.
LV-AI-007.step.1=Check the model name and that the AI servers can be reached.
LV-AI-007.step.2=Check that the model is installed on those servers.
LV-AI-007.step.3=Start LexaVault again after the fix.
LV-AI-008.support=The installed AI model isn't the version approved for LexaVault, so it wasn't used. Please have your IT Admin install the approved version.
LV-AI-008.step.1=Install the approved version of the model on the AI server (its digest is in LexaVault's settings).
LV-AI-008.step.2=To change the model, have the new one approved first, then set its name and digest in LexaVault's settings.
LV-AI-008.step.3=Pages that needed the model are in Review meanwhile; a person decides them.
LV-RED-001.support=One finding has no box on the page, so it can't be blacked out. Please have a reviewer draw its box or dismiss it, then submit the review again.
LV-RED-001.step.1=Open the case's review.
LV-RED-001.step.2=For that finding, draw its box on the page, or dismiss it if it is not sensitive.
LV-RED-001.step.3=Submit the review again.
LV-RED-002.support=The redacted copy didn't pass LexaVault's safety check, so it was not exported. Please don't send the document another way; have your IT Admin retry, and send us the reference number if it repeats.
LV-RED-002.step.1=Nothing unsafe left LexaVault: the copy was not exported.
LV-RED-002.step.2=Retry processing from Support.
LV-RED-002.step.3=If it fails again, give support the reference number. Don't export the document another way.
LV-RED-003.support=The redactions couldn't be applied to this PDF. Your IT Admin can retry; if it repeats, please send us the reference number.
LV-RED-003.step.1=Retry processing from Support.
LV-RED-003.step.2=If it fails again, the PDF may be damaged: ask the source to send it again.
LV-RED-003.step.3=If a good PDF keeps failing, give support the reference number.
LV-RED-004.support=The redacted copy couldn't be stored. Please have your IT Admin check the document storage, then retry processing.
LV-RED-004.step.1=Check that document storage is available and has free space (run the health checks).
LV-RED-004.step.2=Retry processing from Support.
LV-RED-005.support=The final check found a redacted value in the text of the redacted copy, so it was not exported. Please have your IT Admin follow the steps in this guide, and never send us the value.
LV-RED-005.step.1=Nothing about the value is recorded; open the case in Support to see which document stopped.
LV-RED-005.step.2=Look at the redacted pages: a box may not fully cover the value, or the value may also be printed elsewhere on an untouched page. Add or enlarge the redaction in review and process again.
LV-RED-005.step.3=If the searchable text layer is the cause, turn off "Searchable redacted pages" for the entity (Admin › Policy) and retry: redacted pages are then images only.
LV-REV-001.support=Another person decided this first. Please refresh the page to see the decision.
LV-REV-001.step.1=Refresh the page to see the decision that was made.
LV-REV-001.step.2=If you think the decision is wrong, talk to your supervisor.
LV-REV-002.support=The case moved on before this action. Please refresh the page to see where it is now.
LV-REV-002.step.1=Refresh the page to see where the case is now.
LV-REV-002.step.2=You don't need to do anything more on this step.
LV-REV-003.support=Some findings haven't been decided yet. Please confirm or dismiss each one, then continue.
LV-REV-003.step.1=Go through the findings and confirm or dismiss each open one.
LV-REV-003.step.2=Make sure every confirmed finding has a box.
LV-REV-003.step.3=Continue again.
LV-REV-004.support=The confirmation wasn't ticked. Please read it, tick it and submit again.
LV-REV-004.step.1=Read the confirmation and tick it.
LV-REV-004.step.2=Submit again.
LV-REV-005.support=This review is assigned to someone else. If you should do it, please ask your supervisor to assign it to you.
LV-REV-005.step.1=Check who the review is assigned to.
LV-REV-005.step.2=If you should do it, ask your supervisor to assign it to you.
LV-REV-006.support=The box is outside the page or has no size. Please draw it again and save.
LV-REV-006.step.1=Draw the box again inside the page, with a width and a height.
LV-REV-006.step.2=Save again.
LV-REV-007.support=This case can't be processed again in LexaVault. If it is still needed, please ask for the document to be sent as a new case.
LV-REV-007.step.1=This case can't be processed again in LexaVault.
LV-REV-007.step.2=If it must be processed again, ask the source to send the document as a new case.
LV-REV-008.support=Continuing by hand works only for cases stopped at the AI step. Please check on the Problem page where this case stopped.
LV-REV-008.step.1=Check on the Problem page where the case stopped.
LV-REV-008.step.2=If it stopped somewhere else, follow the code shown there, or ask your IT Admin to retry processing.
LV-REV-009.support=The page asked for isn't in the document. Please reload the review page; if it repeats, send us the reference number.
LV-REV-009.step.1=Reload the review page; it then shows only the document's own pages.
LV-REV-009.step.2=If it happens again, give IT the reference number shown.
LV-REV-010.support=A person rejected the case because it holds the wrong document. Please send a new case with the right one.
LV-REV-010.step.1=Check which document the case should hold.
LV-REV-010.step.2=Send a new case with the right document.
LV-REV-011.support=A person rejected the case because its document couldn't be read. Please send a new case with a better copy.
LV-REV-011.step.1=Make a better copy of the document.
LV-REV-011.step.2=Send a new case with it.
LV-REV-012.support=A person rejected the case because it doesn't belong here. Please ask the reviewer's team what should be sent.
LV-REV-012.step.1=Check with the reviewer's team what should be sent.
LV-REV-012.step.2=Send a new case only if it belongs here.
LV-REV-013.support=A person rejected the case as a duplicate. Please use the other case for the same document; nothing more needs to be sent.
LV-REV-013.step.1=Find the other case for the same document.
LV-REV-013.step.2=Send nothing more for this one.
LV-REV-014.support=A person rejected the case and wrote the reason in a ticket. Please read the ticket, and send a new case if it says so.
LV-REV-014.step.1=Read the ticket.
LV-REV-014.step.2=Send a new case if the ticket says so.
LV-REV-015.support=In a bulk approval nobody can approve a case they reviewed themselves. Please ask another supervisor to approve it.
LV-REV-015.step.1=Ask another supervisor to approve this case.
LV-REV-015.step.2=Continue with the other cases yourself.
LV-DLV-001.support=LexaVault couldn't connect to the destination. Please have your IT Admin check the destination and the network, then retry the export.
LV-DLV-001.step.1=Check that the destination is running and that LexaVault can reach it (network, firewall).
LV-DLV-001.step.2=Run the connection test under Integrations.
LV-DLV-001.step.3=Retry the export from Support.
LV-DLV-002.support=The destination said it was busy or had an error. Please have your IT Admin retry after a few minutes, and contact the destination's team if it repeats.
LV-DLV-002.step.1=Wait a few minutes, then retry the export from Support.
LV-DLV-002.step.2=If it keeps failing, contact the destination's team with the time and the reference number.
LV-DLV-003.support=The destination doesn't accept the sensitivity level of the case or of a document. Please have your IT Admin settle this with the destination's team.
LV-DLV-003.step.1=Look under Technical details for the destination's own code and the level it refused.
LV-DLV-003.step.2=Ask the destination's team whether it should accept that level, and change its set-up if so.
LV-DLV-003.step.3=After the fix, choose Retry processing in Support.
LV-DLV-004.support=The destination refused the case or a document and gave its own code. Please have your IT Admin ask the destination's team what that code means.
LV-DLV-004.step.1=Look under Technical details for the destination's own code.
LV-DLV-004.step.2=Look that code up in the destination's own documentation, or ask its team.
LV-DLV-004.step.3=Fix the cause, then send the case again from Support.
LV-DLV-005.support=LexaVault couldn't sign in to the destination. Please have your IT Admin check the stored credential with the destination's team, and never send us the credential.
LV-DLV-005.step.1=Check that the credential is stored where the connection's settings say it is.
LV-DLV-005.step.2=Check with the destination's team that the credential is still valid and has the right access.
LV-DLV-005.step.3=Run the connection test under Integrations, then retry the export from Support.
LV-DLV-006.support=This entity has no enabled destination, or its address isn't valid. Please have your IT Admin check it under Integrations.
LV-DLV-006.step.1=Under Integrations, check that this entity has an enabled destination.
LV-DLV-006.step.2=Check that its profile is chosen and that its address is a valid web address (http or https). The code under Technical details says what is wrong.
LV-DLV-006.step.3=Switch it on or correct it, then retry the export from Support.
LV-DLV-007.support=LexaVault couldn't understand the destination's answer. Please have your IT Admin check with the destination's team that its version is supported.
LV-DLV-007.step.1=Check that the destination runs a version LexaVault supports.
LV-DLV-007.step.2=Contact the destination's team with the time and the reference number.
LV-DLV-007.step.3=Retry the export from Support after the fix.
LV-DLV-008.support=The destination didn't confirm every document of the case. Please have your IT Admin check which ones arrived, then retry the export.
LV-DLV-008.step.1=Check in the destination which documents of the case arrived.
LV-DLV-008.step.2=Retry the export from Support.
LV-DLV-008.step.3=If it happens again, contact the destination's team with the reference number.
LV-DLV-009.support=The destination already has this case, so it counts as exported. No action is needed unless you expected a newer version there.
LV-DLV-009.step.1=Nothing to do: the case counts as exported.
LV-DLV-009.step.2=If you expected a newer version to arrive, check in the destination which version it holds.
LV-DLV-010.support=A folder for this case run is already in the export location. Please have your IT Admin check it before removing or moving it, then send the case again.
LV-DLV-010.step.1=Look in the export location for the folder of this case run, left by an earlier attempt.
LV-DLV-010.step.2=Check whether it is complete, then remove or move it.
LV-DLV-010.step.3=Send the case again from Support.
LV-DLV-011.support=The case has nothing ready to export: a document isn't finished, or its redacted copy is missing. Please have your IT Admin check the case.
LV-DLV-011.step.1=Check in the case panel that every document finished processing.
LV-DLV-011.step.2=If a redacted copy is missing, retry processing from Support.
LV-DLV-011.step.3=Then retry the export.
LV-DLV-012.support=A page matched more than one split rule. Please have your Business Admin make the rules more specific.
LV-DLV-012.step.1=Look at the split rules: one page matched more than one of them.
LV-DLV-012.step.2=Make the rules more specific, so each page matches only one.
LV-DLV-012.step.3=Ask your IT Admin to retry the export.
LV-DLV-013.support=The split document couldn't be made. Your IT Admin can retry it; if it repeats, please send us the reference number.
LV-DLV-013.step.1=Retry from Support.
LV-DLV-013.step.2=If it fails again, check that document storage is available and that the split rules are complete.
LV-DLV-013.step.3=If it still fails, give support the reference number.
LV-DLV-014.support=Retrying can't help with this failure until its cause is fixed. Please have your IT Admin look up the original code under Technical details.
LV-DLV-014.step.1=Look under Technical details for the code of the original failure.
LV-DLV-014.step.2=Fix that cause (look its code up in this guide).
LV-DLV-014.step.3=After the fix, choose Retry processing in Support.
LV-DLV-015.support=A resend failed, so the case is now with your IT team. Please have your IT Admin look up the original code under Technical details.
LV-DLV-015.step.1=Open the case in the IT error queue.
LV-DLV-015.step.2=Look under Technical details for the code of the failure, and follow its steps in this guide.
LV-DLV-015.step.3=Send the case again once the cause is fixed.
LV-DLV-016.support=Part of this case went to the destination with an earlier set-up, so LexaVault stopped instead of sending it twice. Please have your IT Admin look in the destination whether the case is complete there.
LV-DLV-016.step.1=Look in the destination whether the case is there and complete, by its time and case number. Nothing is sent until this is clear, so it can't arrive twice.
LV-DLV-016.step.2=If the connection, address or profile was changed, put the earlier one back and send the case again from the IT error queue.
LV-DLV-016.step.3=Otherwise ask support, with the code and the reference number.
LV-AUT-001.support=Your session ended or couldn't be checked. Please sign in again; if it keeps happening, tell your IT Admin.
LV-AUT-001.step.1=Sign in again.
LV-AUT-001.step.2=If it keeps asking, close all LexaVault tabs and sign in once more.
LV-AUT-001.step.3=If it still happens, tell your IT Admin and give the reference number.
LV-AUT-002.support=You are signed in but have no LexaVault role. Please ask your IT Admin for access.
LV-AUT-002.step.1=Check the person's groups in the login system.
LV-AUT-002.step.2=Check under Sign-in that one of those groups gives a LexaVault role, and add the person to the right group.
LV-AUT-002.step.3=Ask the person to sign out and sign in again.
LV-AUT-003.support=Your account can't open this entity. Please ask your IT Admin to check your access.
LV-AUT-003.step.1=Check that the person's groups give access to this entity.
LV-AUT-003.step.2=Check that the entity is switched on.
LV-AUT-003.step.3=Ask the person to sign out and sign in again.
LV-AUT-004.support=You have access to more than one entity. Please choose the one you want to work in.
LV-AUT-004.step.1=Choose the entity you want to work in from the list.
LV-AUT-004.step.2=You can switch entity later with the entity switch at the top right.
LV-AUT-005.support=This entity is switched off or not set up yet. Please ask the platform operations team about it.
LV-AUT-005.step.1=Check the entity's status.
LV-AUT-005.step.2=Finish its set-up or switch it on, if it should be in use.
LV-AUT-005.step.3=Tell its users once it is active.
LV-AUT-006.support=Your role doesn't allow this action. If you should be able to do it, please ask your Business Admin or IT Admin.
LV-AUT-006.step.1=Check which role the person has and which role the action needs.
LV-AUT-006.step.2=If the person should be able to do it, give them that role.
LV-AUT-006.step.3=Ask the person to sign out and sign in again.
LV-AUT-007.support=Sign-in isn't working because LexaVault and the login system don't match or can't reach each other. Please give your IT Admin the reference number.
LV-AUT-007.step.1=Find the reference number in LexaVault's log: it gives the exact reason.
LV-AUT-007.step.2=Compare the login system's settings with LexaVault's under Sign-in (issuer, audience, groups).
LV-AUT-007.step.3=Check that LexaVault can reach the login system, then ask the person to sign in again.
LV-AUT-008.support=The source system isn't allowed to work on this entity or this case. Please have your IT Admin check its connection under Integrations.
LV-AUT-008.step.1=Under Integrations, check that the source system's client is linked to an enabled connection for this entity.
LV-AUT-008.step.2=Check that the source only works on cases its own connection created.
LV-AUT-008.step.3=Ask the source to send again.
LV-AUT-009.support=The sign-in stopped part way. Please go back to the LexaVault start page and sign in again; if it repeats, tell your IT Admin.
LV-AUT-009.step.1=Person: go back to the LexaVault start page and sign in again.
LV-AUT-009.step.2=If it fails again, close all LexaVault tabs and try once more.
LV-AUT-009.step.3=IT Admin: if it keeps failing, check LexaVault's settings in the login system and under Sign-in.
LV-AUT-010.support=This feature isn't switched on for your entity. Please ask the platform operations team whether it should be.
LV-AUT-010.step.1=Check whether this entity should have the feature.
LV-AUT-010.step.2=If so, switch it on for the entity.
LV-AUT-010.step.3=If not, tell the person it isn't available for their entity.
LV-LIC-001.support=No licence is stored for this installation. Please have your IT team store the licence file you received.
LV-LIC-001.step.1=Ask your IT team to store the licence file you received, with the licence command (install guide: Setup).
LV-LIC-001.step.2=Ask sources to send again any cases that were refused meanwhile.
LV-LIC-002.support=The licence isn't in force, so no new cases are taken in; cases already in LexaVault are finished. Please have your IT Admin check its dates and get a renewed licence if needed.
LV-LIC-002.step.1=See the licence's dates under Admin, Licensing.
LV-LIC-002.step.2=Get a renewed licence from your supplier and ask your IT team to store it with the licence command. No restart is needed.
LV-LIC-002.step.3=Ask sources to send again any cases that were refused meanwhile. Watched folders and polling go on by themselves.
LV-LIC-003.support=The licence can't be read or trusted, or doesn't cover this entity. Please have your IT team store the original licence file again and send us the licence's own code if it is still refused.
LV-LIC-003.step.1=Ask your IT team to read the licence's own code in Support, Status.
LV-LIC-003.step.2=Store the original licence file again with the licence command. If the entity isn't in it, ask your supplier for a licence that lists the entity.
LV-LIC-003.step.3=If it is still refused, get a new licence file from your supplier.
LV-LIC-004.support=The stored licence doesn't cover LexaVault. Please have your IT Admin check what it covers and ask your supplier for one that does.
LV-LIC-004.step.1=See what the licence covers under Admin, Licensing.
LV-LIC-004.step.2=Ask your supplier for a licence that covers LexaVault, and ask your IT team to store it with the licence command.
LV-CFG-001.support=A setting wasn't saved because its value isn't allowed. The message names the field and the allowed range.
LV-CFG-001.step.1=Read the message: it names the field and the allowed range.
LV-CFG-001.step.2=Correct the value.
LV-CFG-001.step.3=Save again.
LV-CFG-002.support=This entity's case fields aren't set up completely. Please have your Business Admin make sure exactly one active field is Primary.
LV-CFG-002.step.1=Open Case fields.
LV-CFG-002.step.2=Make sure at least one case field is active and exactly one is marked Primary.
LV-CFG-002.step.3=Save, then ask sources to send again any cases that were refused.
LV-CFG-003.support=The connection's settings are missing, duplicated or not allowed. The message says which one; please have your IT Admin correct it.
LV-CFG-003.step.1=Read the message: it says which setting is wrong.
LV-CFG-003.step.2=Fill in what is missing, use a name and client that no other connection uses, and use an address LexaVault is allowed to call.
LV-CFG-003.step.3=Save again.
LV-CFG-004.support=The connection test failed. Please have your IT Admin read the details, which say at which step, and fix that step.
LV-CFG-004.step.1=Read the details: they say at which step the test failed.
LV-CFG-004.step.2=Fix that step (address, sign-in, network, or the other system itself).
LV-CFG-004.step.3=Run the test again.
LV-CFG-005.support=Only one main export destination can be switched on for each entity. Please have your IT Admin choose one.
LV-CFG-005.step.1=Under Integrations, decide which connection is this entity's main export destination.
LV-CFG-005.step.2=Switch the other one off.
LV-CFG-005.step.3=Save again.
LV-CFG-006.support=A split rule is incomplete, repeats another or points to a missing destination. Please have your IT Admin correct it.
LV-CFG-006.step.1=Fill in every field of the rule, and remove any rule that repeats another.
LV-CFG-006.step.2=Point the rule to a destination that exists, is switched on and sends out.
LV-CFG-006.step.3=Save again.
LV-CFG-007.support=The watched folder belongs to another entity or isn't set up. Please have your IT Admin check which entity it is for.
LV-CFG-007.step.1=Check which entity the watched folder is set up for.
LV-CFG-007.step.2=If it should be this entity, set it up for this entity.
LV-CFG-007.step.3=Otherwise, work with the watched folder from the entity it belongs to.
LV-CFG-008.support=The draft login settings are incomplete or failed their test. Please have your IT Admin complete them and run the test again.
LV-CFG-008.step.1=Under Sign-in, complete the draft login settings.
LV-CFG-008.step.2=Run the test and fix what it reports (for example the issuer address).
LV-CFG-008.step.3=Activate the draft once the test passes.
LV-CFG-009.support=A scanner setting is outside its allowed range. Please have your IT Admin correct it in the Scan Bridge.
LV-CFG-009.step.1=Check the scanner settings in the Scan Bridge (source, resolution, page limit, time limit) against their allowed ranges.
LV-CFG-009.step.2=Correct the value that is out of range.
LV-CFG-009.step.3=Restart the Scan Bridge.
LV-CFG-010.support=The connection is switched off or isn't the right kind for this action. Please have your IT Admin check it under Integrations.
LV-CFG-010.step.1=Under Integrations, check that the connection is switched on.
LV-CFG-010.step.2=Check that it is the right kind of connection for this action (for example a polling source).
LV-CFG-010.step.3=Try again.
LV-CFG-011.support=The case or incident can't take this action in its current state. Please reload the page to see its state.
LV-CFG-011.step.1=Reload the page to see the case's or incident's current state.
LV-CFG-011.step.2=Holds and restarts are only for cases that stopped and were never exported; a closed incident allows no more actions.
LV-CFG-011.step.3=If the case needs work again, open it from Support while it still shows a problem.
LV-CFG-012.support=A sensitive case field can't be used until the key service is set up. Please save the field without Sensitive, or ask your IT team to set up the key service.
LV-CFG-012.step.1=Save the field without Sensitive, or ask your IT team to set up the key service first (docs/install/KEY_SERVICE.md).
LV-CFG-012.step.2=Nothing was saved.
LV-CFG-013.support=This item is always removed from documents and can't be kept as a case field. Please have your Business Admin remove it from the list.
LV-CFG-013.step.1=Remove the field from the list. Locked items are always removed from documents and never kept beside them.
LV-CFG-013.step.2=If the field is something else, give it a name that says so.
LV-CFG-014.support=An item can be redacted or kept as a case field, not both. Please have your Business Admin decide which for this entity.
LV-CFG-014.step.1=Decide for this entity: either the item is redacted, or it is kept as a case field.
LV-CFG-014.step.2=To keep it as a case field, switch the item off under Safe policy first. To redact it, remove the case field first.
LV-CFG-014.step.3=Save again.
LV-CFG-015.support=The field already has values, so these settings can't change any more. Please have your Business Admin add a new field instead.
LV-CFG-015.step.1=Leave these settings as they were, or add a new field with the new settings and switch the old one off.
LV-CFG-015.step.2=Existing values stay with the old field.
LV-SYS-001.support=An unexpected error happened. Please send us the reference number and the time, and tell us what you were doing, without any document content.
LV-SYS-001.step.1=If you are not IT: try once more, and if it fails again, give IT the reference number and the time.
LV-SYS-001.step.2=IT Admin: find the reference number in LexaVault's log to see what failed.
LV-SYS-001.step.3=If the log doesn't explain it, give support the reference number.
LV-SYS-002.support=LexaVault can't read or write its document storage. Please have your IT Admin check the storage, then retry the failed work.
LV-SYS-002.step.1=Check that the document storage is reachable, has free space and can be written by LexaVault.
LV-SYS-002.step.2=Run the health checks.
LV-SYS-002.step.3=Retry the failed work from Support, and ask sources to send again anything that was refused.
LV-SYS-003.support=LexaVault can't reach its database. Please have your IT Admin check that it is running and can be reached.
LV-SYS-003.step.1=Check that the database is running and can be reached from LexaVault.
LV-SYS-003.step.2=Run the health checks once it is back.
LV-SYS-003.step.3=Retry the failed work from Support.
LV-SYS-004.support=LexaVault couldn't take more work at that moment. Please try again after a few minutes.
LV-SYS-004.step.1=Wait a few minutes, then try again.
LV-SYS-004.step.2=If it happens often, check the server's load and add capacity.
LV-SYS-005.support=LexaVault didn't start because a setting is wrong. Please have your IT Admin read the start-up log, which names it.
LV-SYS-005.step.1=Read LexaVault's start-up log: it names the setting.
LV-SYS-005.step.2=Correct the setting.
LV-SYS-005.step.3=Start LexaVault again.
LV-SYS-006.support=A part LexaVault depends on failed its health check. Please have your IT Admin see which part it is and follow the steps for it.
LV-SYS-006.step.1=See which part failed its check.
LV-SYS-006.step.2=Follow the steps for that part: AI model LV-AI-001, text reader LV-PRC-005, database LV-SYS-003, storage LV-SYS-002, destination LV-DLV-001.
LV-SYS-006.step.3=Run the health checks again.
LV-SYS-007.support=A temporary file couldn't be deleted after a failure and may hold document content. Please have your IT Admin find and delete it safely, and don't send it to us.
LV-SYS-007.step.1=Find the reference number in LexaVault's log: it gives the temporary file's id. The file is in LexaVault's temporary folder.
LV-SYS-007.step.2=Delete the file safely. It may hold document content.
LV-SYS-007.step.3=Check why it couldn't be deleted (access rights, a file still in use).
LV-SYS-008.support=The item asked for doesn't exist in this entity. Please reload the page and check the entity; if it should be there, send us the reference number.
LV-SYS-008.step.1=Reload the page: the item may have been removed by someone else.
LV-SYS-008.step.2=Check that you are working in the right entity.
LV-SYS-008.step.3=If the item should be there, give IT the reference number shown.
LV-SYS-009.support=The source system called an address or method that LexaVault doesn't offer. Please have its team check the call against the API documentation.
LV-SYS-009.step.1=Check the address and HTTP method against LexaVault's API documentation.
LV-SYS-009.step.2=Fix the call in the source system and send it again. Nothing was taken in.
LV-SYS-010.support=LexaVault can't reach its key service, so it can't open or store documents. Please have your IT Admin check the key service, then retry the failed work.
LV-SYS-010.step.1=Check that the key service is running, unsealed and can be reached from LexaVault. The Support status page names the key service's own code.
LV-SYS-010.step.2=Nothing is lost: retry the failed work from Support once it is back, and ask sources to send again anything that was refused.
LV-SYS-011.support=The key service refused LexaVault, or the customer's keys are missing or switched off. Please have your IT Admin check it, and tell us first if this is part of a customer exit.
LV-SYS-011.step.1=Check LexaVault's login and policy in the key service, and that setup created the customer's keys (docs/install/KEY_SERVICE.md). The Support status page names the key service's own code.
LV-SYS-011.step.2=After a customer exit this is expected: do not create the keys again.
LV-SYS-011.step.3=Otherwise retry the failed work from Support.
LV-SYS-012.support=LexaVault didn't open a stored file because its protection couldn't be confirmed. Please don't retry; have your IT Admin find out what changed in the storage.
LV-SYS-012.step.1=Don't retry. Find out who or what changed the document storage or its records, for example a partial restore.
LV-SYS-012.step.2=Restore the file from a backup that belongs to the same database, or ask the source to send the document again.
LV-SYS-013.support=The database was restored from a backup, so LexaVault takes no work until the erase replay has run. Please have your IT Admin run it.
LV-SYS-013.step.1=Check that the erase log location is mounted.
LV-SYS-013.step.2=Run the erase replay once (docs/install/ERASE_LOG.md), then start LexaVault again.
LV-SYS-014.support=LexaVault can't use its erase log, so nothing is erased and no work is taken. Please have your IT Admin check the erase log's location.
LV-SYS-014.step.1=Check that the erase log location is mounted and can be written by LexaVault. The Support status page names the erase log's own code (docs/install/ERASE_LOG.md).
LV-SYS-014.step.2=Erasures that were waiting are done by themselves once it is back.
LV-SYS-015.support=The request's data is larger than LexaVault takes, so it was not read. Please send less at a time, or have your IT Admin check the limit.
LV-SYS-015.step.1=Send less in one request, for example fewer values or a smaller logo.
LV-SYS-015.step.2=If the request is right, ask IT to raise securedoc.api.max-request-body.
