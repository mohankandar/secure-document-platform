services:
  postgres:
    image: postgres:16-alpine
    container_name: securedoc-postgres
    environment:
      POSTGRES_DB: securedoc
      POSTGRES_USER: securedoc
      POSTGRES_PASSWORD: securedoc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - securedoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedoc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  securedoc-pgdata:
